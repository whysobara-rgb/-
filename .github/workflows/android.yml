name: Android execution
on:
  pull_request:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Optional HTTPS test API URL; defaults to the Render test server'
        type: string
        required: false
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GACHA_TEST_API_URL: ${{ inputs.api_base_url || vars.GACHA_TEST_API_URL || 'https://gacha-vault-backend.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Validate optional test endpoint
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          value = os.environ.get('GACHA_TEST_API_URL', '')
          if value:
              url = urlsplit(value)
              assert url.scheme == 'https' and url.hostname and not url.username and not url.password and not url.query and not url.fragment, 'Use a plain HTTPS API base URL'
          PY
      - name: Build installable debug app
        run: |
          flutter build apk --debug --dart-define="API_BASE_URL=$GACHA_TEST_API_URL" --dart-define=ENABLE_GP_ORDER_PREVIEW=true
          mkdir -p build/deliverables
          cp build/app/outputs/flutter-apk/app-debug.apk build/deliverables/gachigacha-test-debug.apk
          python - <<'PY'
          import os, pathlib
          endpoint = os.environ.get('GACHA_TEST_API_URL', '')
          pathlib.Path('build/deliverables/BUILD_SCOPE.txt').write_text('Debug package: com.gachavault.gacha.debug\nEntrypoint: lib/main.dart\nAPI: ' + (endpoint or 'NOT CONFIGURED - startup only, no login/purchase service') + '\nNot signed for production release.\n')
          PY
          (cd build/deliverables && sha256sum gachigacha-test-debug.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-app
          path: |
            build/deliverables/gachigacha-test-debug.apk
            build/deliverables/BUILD_SCOPE.txt
            build/deliverables/SHA256SUMS
          retention-days: 14
      - name: Build native storage probe
        run: |
          flutter build apk --debug --target=tool/android/storage_probe.dart
          cp build/app/outputs/flutter-apk/app-debug.apk build/deliverables/storage-probe-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python tool/android/emulator_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-execution-evidence
          path: build/android-evidence
          if-no-files-found: ignore
          retention-days: 14
