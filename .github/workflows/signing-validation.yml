name: Staging signing import validation (no build)

# Isolated branch only: never runs on the application PR or staging-build tags.
on:
  push:
    branches: ['codex/staging-signing-validation']

permissions:
  contents: read

jobs:
  signing-import:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/staging-signing-validation' && !github.event.deleted
    runs-on: macos-15
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Import existing staging identity and inspect existing Ad Hoc profile
        env:
          STAGING_P12: ${{ secrets.STAGING_IOS_CERTIFICATE_P12_BASE64 }}
          STAGING_P12_PASSWORD: ${{ secrets.STAGING_IOS_CERTIFICATE_PASSWORD }}
          STAGING_PROFILE: ${{ secrets.STAGING_IOS_ADHOC_PROFILE_BASE64 }}
        shell: bash
        run: |
          set +x
          python3 - <<'PY'
          import base64
          import datetime
          import hashlib
          import os
          import pathlib
          import plistlib
          import secrets
          import shutil
          import subprocess
          import sys
          import tempfile

          # No checkout, SDK setup, network/API access, app build, or artifact upload.
          EXPECTED_SHA1 = '27383C642AF5A956690DC3EF17D19CAE2530AD80'
          EXPECTED_SHA256 = 'b9a8fc18bfd1f841eb5c5b5142f7ba53d1580d6a64a27e2bbe3b952be9012357'
          EXPECTED_P12_SHA256 = 'fea16e3502c235a7a12f96bc6f3ab0a036626c9b8f84fe26702be9f39e8a1933'
          EXPECTED_DEVICE_DIGEST = '09aa11538f89e50152c3880d89237035f9643eedc4ba41a7b472c9227887070c'
          EXPECTED_UUID = 'bb447feb-6d61-42ba-854c-a1265bbad26f'
          TEAM = '27Y574N7TW'
          BUNDLE = 'com.gachavault.gachaVault.staging'
          stage = 'secret availability'
          created_keychain = False
          installed_profile = None
          temp = None
          failed = False
          cleanup_failed = False
          os.umask(0o077)

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def run(args, input_data=None):
              result = subprocess.run(args, input=input_data, stdout=subprocess.PIPE,
                                      stderr=subprocess.PIPE, check=False)
              if result.returncode:
                  # Command output/arguments can contain sensitive data.
                  diagnostics = result.stderr.decode(errors='replace').lower()
                  categories = {
                      'mac verification failed': 'PKCS12 MAC verification rejected by macOS',
                      'unknown format': 'macOS did not recognize the container format',
                      'unsupported': 'macOS reported unsupported encoding or algorithm',
                      'interaction is not allowed': 'keychain access requires interaction',
                  }
                  for marker, category in categories.items():
                      if marker in diagnostics:
                          print('DIAGNOSTIC CATEGORY: ' + category, flush=True)
                          break
                  print('DIAGNOSTIC EXIT CODE: ' + str(result.returncode), flush=True)
                  raise RuntimeError('command failed; diagnostic output withheld')
              return result.stdout

          def success(message):
              print('PASS: ' + message, flush=True)

          try:
              require(sys.platform == 'darwin', 'macOS runner required')
              values = {key: os.environ.pop(key, '') for key in
                        ('STAGING_P12', 'STAGING_P12_PASSWORD', 'STAGING_PROFILE')}
              require(all(values.values()), 'required signing secret missing')
              temp = pathlib.Path(tempfile.mkdtemp(prefix='staging-signing-', dir=os.environ['RUNNER_TEMP']))
              p12 = temp / 'staging.p12'
              profile = temp / 'staging.mobileprovision'
              keychain = temp / 'staging.keychain-db'
              p12.write_bytes(base64.b64decode(values['STAGING_P12'], validate=True))
              profile.write_bytes(base64.b64decode(values['STAGING_PROFILE'], validate=True))
              password = values.pop('STAGING_P12_PASSWORD')
              values.clear()

              stage = 'original versus decoded PKCS12 byte integrity'
              digest = hashlib.sha256(p12.read_bytes()).hexdigest()
              print('PKCS12 SHA256 B: ' + digest, flush=True)
              require(digest == EXPECTED_P12_SHA256, 'PKCS12 bytes changed during secret transport')
              success(stage + ': A equals B')

              stage = 'exact password input format'
              require(password == password.strip() and not any(c in password for c in '\r\n\x00'),
                      'password contains whitespace or a line terminator; no implicit trimming allowed')
              success(stage + ': no trimming or substitution')

              stage = 'OpenSSL PKCS12 MAC with exact GitHub password secret'
              candidates = ['/opt/homebrew/opt/openssl@3/bin/openssl',
                            '/usr/local/opt/openssl@3/bin/openssl', shutil.which('openssl')]
              openssl = next((p for p in candidates if p and pathlib.Path(p).is_file()), None)
              require(openssl is not None, 'OpenSSL executable missing')
              run([openssl, 'pkcs12', '-in', str(p12), '-noout', '-passin', 'stdin'],
                  input_data=password.encode() + b'\n')
              success(stage + ': password matches; MAC valid')

              stage = 'PKCS12 certificate and private key pair'
              private_pem = run([openssl, 'pkcs12', '-in', str(p12), '-nocerts', '-nodes',
                                 '-passin', 'stdin'], input_data=password.encode() + b'\n')
              cert_pem = run([openssl, 'pkcs12', '-in', str(p12), '-clcerts', '-nokeys',
                              '-passin', 'stdin'], input_data=password.encode() + b'\n')
              private_public = run([openssl, 'pkey', '-pubout', '-outform', 'DER'], input_data=private_pem)
              private_pem = None
              cert_der = run([openssl, 'x509', '-outform', 'DER'], input_data=cert_pem)
              cert_public_pem = run([openssl, 'x509', '-pubkey', '-noout'], input_data=cert_pem)
              cert_public = run([openssl, 'pkey', '-pubin', '-outform', 'DER'], input_data=cert_public_pem)
              require(private_public == cert_public, 'private key does not match certificate')
              require(hashlib.sha256(cert_der).hexdigest() == EXPECTED_SHA256, 'certificate changed')
              success(stage + ': existing identity unchanged')

              stage = 'Ad Hoc profile decode and validation'
              decoded = plistlib.loads(run(['security', 'cms', '-D', '-i', str(profile)]))
              entitlements = decoded['Entitlements']
              require(decoded['Name'] == 'GachiGacha Staging CI Ad Hoc 20260922', 'profile name mismatch')
              require(decoded['UUID'].lower() == EXPECTED_UUID, 'profile UUID mismatch')
              require(decoded['TeamIdentifier'] == [TEAM], 'team mismatch')
              require(entitlements['application-identifier'] == TEAM + '.' + BUNDLE, 'bundle ID mismatch')
              require(entitlements['com.apple.developer.team-identifier'] == TEAM, 'entitlement team mismatch')
              require(entitlements.get('get-task-allow') is False, 'development profile rejected')
              require(not decoded.get('ProvisionsAllDevices', False), 'enterprise profile rejected')
              devices = decoded.get('ProvisionedDevices', [])
              require(len(devices) == len(set(devices)) == 2, 'expected two devices')
              require(hashlib.sha256('\n'.join(sorted(devices)).encode()).hexdigest() == EXPECTED_DEVICE_DIGEST,
                      'device set differs from verified supplied profile')
              certificates = decoded['DeveloperCertificates']
              require(len(certificates) == 1, 'expected only staging CI certificate')
              require(hashlib.sha256(certificates[0]).hexdigest() == EXPECTED_SHA256, 'certificate mismatch')
              expiration = decoded['ExpirationDate'].replace(tzinfo=datetime.timezone.utc)
              require(expiration.date().isoformat() == '2027-09-22', 'expiration mismatch')
              require(expiration > datetime.datetime.now(datetime.timezone.utc), 'profile expired')
              success(stage + ': staging bundle, matching certificate, two devices, expiry 2027-09-22')

              stage = 'provisioning profile installation'
              destination = pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles'
              destination.mkdir(parents=True, exist_ok=True)
              target = destination / (EXPECTED_UUID + '.mobileprovision')
              with target.open('xb') as file:
                  installed_profile = target
                  file.write(profile.read_bytes())
              require(target.read_bytes() == profile.read_bytes(), 'installed profile differs')
              success(stage)

              stage = 'temporary keychain creation'
              keychain_password = secrets.token_urlsafe(48)
              run(['security', 'create-keychain', '-p', keychain_password, str(keychain)])
              created_keychain = True
              run(['security', 'set-keychain-settings', '-lut', '3600', str(keychain)])
              run(['security', 'unlock-keychain', '-p', keychain_password, str(keychain)])
              success(stage)

              stage = 'PKCS12 import'
              run(['security', 'import', str(p12), '-k', str(keychain), '-P', password,
                   '-T', '/usr/bin/codesign', '-T', '/usr/bin/security'])
              password = None
              success(stage)
              stage = 'private key access configuration'
              run(['security', 'set-key-partition-list', '-S', 'apple-tool:,apple:,codesign:',
                   '-s', '-k', keychain_password, str(keychain)])
              success(stage)

              stage = 'valid signing identity recognition'
              identities = run(['security', 'find-identity', '-v', '-p', 'codesigning', str(keychain)]).decode()
              require(EXPECTED_SHA1 in identities, 'expected valid signing identity missing')
              require('1 valid identities found' in identities, 'expected exactly one valid identity')
              success(stage)

          except Exception:
              print('FAIL: ' + stage + '; sensitive diagnostic details withheld', flush=True)
              failed = True
          finally:
              if installed_profile is not None:
                  installed_profile.unlink(missing_ok=True)
              if created_keychain:
                  result = subprocess.run(['security', 'delete-keychain', str(keychain)],
                                          stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  cleanup_failed = result.returncode != 0
              if temp is not None:
                  shutil.rmtree(temp, ignore_errors=False)
              print('FAIL: temporary keychain cleanup' if cleanup_failed else
                    'PASS: temporary signing files, keychain and installed profile cleaned', flush=True)
          if failed or cleanup_failed:
              sys.exit(1)
          success('signing-only validation complete; no native build, upload, or device installation')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Signing import validation passed on macOS.\n\n'
                            '- Temporary keychain: created and removed\n'
                            '- PKCS12 import: passed\n'
                            '- Valid signing identity: exact verified staging certificate\n'
                            '- Ad Hoc profile: exact staging bundle, 2 verified devices, expiry 2027-09-22\n'
                            '- Profile installation and cleanup: passed\n'
                            '- Native build / archive / IPA export: not run\n'
                            '- Firebase upload / iPhone installation: not run\n')
          PY
