name: Flutter quality
on:
  pull_request:
  push:
    branches: [main, master, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-flutter-lockfile
          path: pubspec.lock
          retention-days: 7
      - run: flutter analyze
      - run: flutter test
