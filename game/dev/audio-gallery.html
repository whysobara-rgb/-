<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>뿌리째 털어라 — audio gallery</title>
    <style>
      :root {
        --bg: #1e1838;
        --panel: #2a2150;
        --panel2: #352a63;
        --ink: #fff8ee;
        --muted: #b9add9;
        --accent: #ffd66b;
        --good: #9effc8;
        --warn: #ff9d7a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 system-ui, 'Noto Sans KR', sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        gap: 12px 20px;
        align-items: center;
        padding: 12px 20px;
        background: #171130;
        border-bottom: 1px solid #3c3170;
      }
      header h1 {
        margin: 0;
        font-size: 18px;
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 16px;
        padding: 16px 20px 80px;
      }
      section {
        background: var(--panel);
        border-radius: 14px;
        padding: 14px 16px;
      }
      section h2 {
        margin: 0 0 10px;
        font-size: 15px;
        color: var(--accent);
      }
      button {
        font: inherit;
        color: var(--ink);
        background: var(--panel2);
        border: 1px solid #4b3f86;
        border-radius: 9px;
        padding: 5px 10px;
        cursor: pointer;
      }
      button:hover {
        background: #43367a;
      }
      button.on {
        background: #5b4bb0;
        border-color: var(--accent);
      }
      button.small {
        padding: 2px 7px;
        font-size: 12px;
        color: var(--muted);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin: 4px 0;
      }
      section.wide {
        grid-column: 1 / -1;
      }
      .sfx-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
        column-gap: 24px;
      }
      .sfx {
        display: grid;
        grid-template-columns: 130px 1fr;
        align-items: center;
        gap: 6px;
        padding: 3px 0;
        border-bottom: 1px solid #3a2f6c;
      }
      .sfx .name {
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
      label.slider {
        display: grid;
        grid-template-columns: 90px 1fr 46px;
        gap: 8px;
        align-items: center;
      }
      input[type='range'] {
        width: 100%;
      }
      #pad {
        width: 100%;
        aspect-ratio: 8 / 5;
        background: #120d26;
        border-radius: 10px;
        cursor: crosshair;
        display: block;
      }
      #meter {
        font: 13px/1.4 ui-monospace, monospace;
        color: var(--good);
      }
      #captions {
        min-height: 72px;
        font-size: 15px;
      }
      #captions div {
        animation: fade 2.6s forwards;
      }
      @keyframes fade {
        80% {
          opacity: 1;
        }
        100% {
          opacity: 0.25;
        }
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
      }
      #unlock.ready {
        background: #2f6b4f;
        border-color: var(--good);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>오디오 갤러리 · Audio gallery</h1>
      <button id="unlock">Unlock audio</button>
      <span id="meter">—</span>
      <span class="hint">Every sound is synthesized live (WebAudio, no files). Click the pad to place sounds in space.</span>
    </header>
    <main id="app"></main>
    <script type="module" src="../src/audio/dev/gallery.ts"></script>
  </body>
</html>
