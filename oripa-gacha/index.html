<title>럭키팩 오리파</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<style>
/* Layout: phone app shell — sticky point bar, pack feed, bottom tabs; pulls play full-screen */
:root{
  --bg:#f3eefe; --card:#ffffff; --ink:#2b2140; --muted:#8a7fa6; --pri:#ff4f8b; --pri-d:#c92c63; --mint:#3fd0b0; --sky:#5b8cff; --gold:#ffbf2e;
  --f-d:"Black Han Sans","Apple SD Gothic Neo",sans-serif; --f-u:"Jua","Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17122a;--card:#241c3d;--ink:#f4efff;--muted:#a99cc9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17122a;--card:#241c3d;--ink:#f4efff;--muted:#a99cc9;color-scheme:dark}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-u);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:12px 10px}
.logo{font-family:var(--f-d);font-size:26px;color:var(--pri);letter-spacing:.01em;text-shadow:0 3px 0 rgba(201,44,99,.25)}
.logo span{color:var(--sky)}
.pt{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 6px 6px 12px;box-shadow:0 4px 0 rgba(43,33,64,.08)}
.pt b{font-family:var(--f-d);font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
.pt .coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 55%,#d48a00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.pt button{border:0;background:var(--pri);color:#fff;font:inherit;border-radius:999px;padding:5px 10px;cursor:pointer}
.banner{border-radius:22px;padding:18px;color:#fff;background:linear-gradient(120deg,#ff4f8b,#a35bff 55%,#5b8cff);box-shadow:0 8px 0 rgba(120,50,200,.25);position:relative;overflow:hidden;margin-bottom:16px}
.banner h2{font-family:var(--f-d);font-weight:400;font-size:24px;margin:0 0 4px;text-wrap:balance}
.banner p{margin:0;font-size:14px;opacity:.9}
.banner::after{content:"SSS";position:absolute;right:-6px;bottom:-22px;font-family:var(--f-d);font-size:92px;opacity:.16}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px}
.chip{flex:none;border:0;font:inherit;padding:7px 14px;border-radius:999px;background:var(--card);color:var(--muted);cursor:pointer;box-shadow:0 3px 0 rgba(43,33,64,.07)}
.chip.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pack{background:var(--card);border-radius:22px;overflow:hidden;cursor:pointer;box-shadow:0 6px 0 rgba(43,33,64,.08);transition:transform .12s;border:0;padding:0;font:inherit;color:inherit;text-align:left}
.pack:active{transform:scale(.97)}
.pack .art{aspect-ratio:1/1.05;max-width:100%;position:relative;display:flex;align-items:center;justify-content:center;font-size:56px}
.pack .art .tag{position:absolute;left:10px;top:10px;background:#fff;color:var(--pri);font-size:11px;padding:3px 8px;border-radius:999px}
.pack .art .hot{position:absolute;right:10px;top:10px;background:var(--ink);color:#fff;font-size:11px;padding:3px 8px;border-radius:999px}
.pack .info{padding:10px 12px 12px}
.pack h3{margin:0;font-size:15px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pack .price{font-family:var(--f-d);font-size:17px;color:var(--pri);margin-top:2px}
.bar{height:8px;background:rgba(138,127,166,.2);border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sky));border-radius:99px}
.left{font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);display:flex;justify-content:center;box-shadow:0 -4px 20px rgba(43,33,64,.1);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs button{flex:1;max-width:160px;border:0;background:none;font:inherit;color:var(--muted);padding:12px 0 14px;cursor:pointer;font-size:14px}
.tabs button.on{color:var(--pri)}
.tabs button span{display:block;font-size:20px}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* detail sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,12,40,.55);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sheet .in{background:var(--bg);width:100%;max-width:480px;border-radius:26px 26px 0 0;max-height:88%;overflow-y:auto;animation:up .3s cubic-bezier(.2,1.2,.4,1);
  padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@keyframes up{from{transform:translateY(100%)}}
.sheet h2{font-family:var(--f-d);font-weight:400;margin:0;font-size:24px}
.odds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.odds div{background:var(--card);border-radius:14px;padding:8px;text-align:center}
.odds b{display:block;font-family:var(--f-d);font-weight:400;font-size:20px}
.odds small{color:var(--muted);font-size:12px}
.prizes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.buy{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn{border:0;font:inherit;font-size:17px;color:#fff;border-radius:18px;padding:14px 8px;cursor:pointer;background:var(--sky);box-shadow:0 5px 0 #3a63c9;transition:transform .08s}
.btn.p{background:var(--pri);box-shadow:0 5px 0 var(--pri-d)}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn small{display:block;font-size:12px;opacity:.85}
.btn:disabled{opacity:.45}

/* trading card */
.tc{aspect-ratio:63/88;max-width:100%;border-radius:10px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 4px 0 rgba(0,0,0,.15)}
.tc .em{font-size:2.2em;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.tc .nm{font-size:.62em;margin-top:.3em;text-align:center;padding:0 4px;line-height:1.1}
.tc .gr{position:absolute;left:5px;top:4px;font-family:var(--f-d);font-size:.6em}
.g-B{background:linear-gradient(160deg,#9aa6c2,#5d6886)}
.g-A{background:linear-gradient(160deg,#5ad6ff,#2f6fe0)}
.g-S{background:linear-gradient(160deg,#ffd54a,#f08a00)}
.g-SSS{background:linear-gradient(135deg,#ff5f8f,#ffb84a,#5fffb0,#5bb0ff,#c35bff);background-size:300% 300%;animation:holo 2.5s linear infinite}
@keyframes holo{to{background-position:300% 0}}
.g-SSS::after,.g-S::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);background-size:250% 100%;animation:shine 2s linear infinite}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}

/* pull stage */
.stage{position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 50% 45%,#3a2470,#0c0718);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.packbig{width:min(52vw,220px);aspect-ratio:3/4;border-radius:18px;position:relative;z-index:2;display:flex;align-items:center;justify-content:center;font-size:80px;
  box-shadow:0 10px 0 rgba(0,0,0,.3),0 0 60px rgba(255,255,255,.2);cursor:pointer}
.packbig::before{content:"";position:absolute;left:0;right:0;top:14%;height:6px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.8) 0 8px,transparent 8px 14px)}
.packbig.shake{animation:pshake .12s infinite}
@keyframes pshake{0%{transform:rotate(-3deg) scale(1.02)}50%{transform:rotate(3deg) scale(1.05)}100%{transform:rotate(-3deg) scale(1.02)}}
.packbig.boom{animation:boom .45s forwards}
@keyframes boom{to{transform:scale(1.8);opacity:0;filter:brightness(3)}}
.hint{color:#fff;margin-top:22px;z-index:2;font-size:16px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.35}}
.glow{position:absolute;width:140vmax;height:140vmax;border-radius:50%;z-index:1;opacity:0;pointer-events:none}
.glow.on{animation:gl 1.2s ease-out forwards}
@keyframes gl{0%{opacity:0;transform:scale(.1)}30%{opacity:1}100%{opacity:.55;transform:scale(1)}}
.reveal{z-index:3;display:flex;flex-direction:column;align-items:center;gap:14px}
.flip{width:min(60vw,240px);perspective:900px;cursor:pointer}
.flip .fi{position:relative;transition:transform .7s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d;transform:rotateY(180deg)}
.flip.open .fi{transform:none}
.flip .tc{font-size:42px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .back{position:absolute;inset:0;transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#2b2140 0 12px,#3a2c5a 12px 24px);border:6px solid #fff;
  display:flex;align-items:center;justify-content:center;font-family:var(--f-d);color:var(--gold);font-size:34px}
.grade{font-family:var(--f-d);font-size:clamp(48px,16vw,84px);line-height:1;color:#fff;animation:slam .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{from{transform:scale(3);opacity:0}}
.grade.B{text-shadow:0 5px 0 #5d6886}.grade.A{text-shadow:0 5px 0 #2f6fe0,0 0 30px #5ad6ff}.grade.S{text-shadow:0 5px 0 #b06000,0 0 40px #ffd54a}
.grade.SSS{background:linear-gradient(90deg,#ff5f8f,#ffb84a,#5fffb0,#5bb0ff,#c35bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 rgba(0,0,0,.4)) drop-shadow(0 0 20px #fff)}
.cname{color:#fff;font-size:18px}
.multi{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:440px;z-index:3}
.multi .slot{perspective:600px}
.multi .fi{position:relative;transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d;transform:rotateY(180deg)}
.multi .slot.open .fi{transform:none}
.multi .tc{font-size:15px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.multi .back{position:absolute;inset:0;transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;background:repeating-linear-gradient(45deg,#2b2140 0 6px,#3a2c5a 6px 12px);border:3px solid #fff;border-radius:10px}
.multi .slot.hi .tc{box-shadow:0 0 0 3px #fff,0 0 20px #fff}
.sumrow{color:#fff;z-index:3;margin-top:16px;text-align:center}
.stage .btn{z-index:3;margin-top:14px;min-width:200px}
.flash{position:fixed;inset:0;background:#fff;z-index:40;pointer-events:none;opacity:0}
.flash.go{animation:fl .5s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}

/* inventory */
.inv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.inv .it{position:relative}
.inv .tc{font-size:16px}
.inv .ct{position:absolute;right:-4px;top:-6px;background:var(--ink);color:var(--bg);font-size:11px;border-radius:99px;padding:2px 6px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.sec{font-family:var(--f-d);font-size:20px;margin:6px 0 12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--card);border-radius:14px;padding:8px;text-align:center}
.stats b{display:block;font-family:var(--f-d);font-size:20px;font-weight:400}
.stats small{color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:50;font-size:14px}
@media (prefers-reduced-motion:reduce){.g-SSS,.g-SSS::after,.g-S::after,.packbig.shake{animation:none}}
</style>

<div class="wrap">
  <div class="top">
    <div class="logo">럭키<span>팩</span></div>
    <div class="pt"><span class="coin"></span><b id="pts">0</b><button id="charge">충전</button></div>
  </div>
  <main id="home">
    <div class="banner"><h2>오늘의 SSS 확률 UP!</h2><p>잔여 수량이 줄어들수록 남은 대박 확률은 올라가요</p></div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="packs"></div>
  </main>
  <main id="box" hidden>
    <div class="sec">내 컬렉션</div>
    <div class="stats" id="stats"></div>
    <div class="inv" id="inv"></div>
  </main>
</div>
<nav class="tabs"><button class="on" data-t="home"><span>🎴</span>오리파</button><button data-t="box"><span>🗃️</span>컬렉션</button></nav>

<div class="sheet" id="sheet" hidden><div class="in" id="sheetIn"></div></div>
<div class="stage" id="stage" hidden><canvas id="fx"></canvas><div class="glow" id="glow"></div><div id="stageBody" style="display:contents"></div></div>
<div class="flash" id="flash"></div>

<script>
const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=n=>n.toLocaleString('ko-KR');
const GR=['SSS','S','A','B'];
const GCOL={SSS:'conic-gradient(#ff5f8f,#ffb84a,#5fffb0,#5bb0ff,#c35bff,#ff5f8f)',S:'radial-gradient(circle,#fff6b0,#ffb800 40%,transparent 70%)',A:'radial-gradient(circle,#c8f2ff,#3f9cff 40%,transparent 70%)',B:'radial-gradient(circle,#e0e4f0,#7a86a6 40%,transparent 70%)'};
const PACKS=[
 {id:'dragon',name:'드래곤 레전드 오리파',cat:'몬스터',price:500,em:'🐲',bg:'linear-gradient(150deg,#ff8a5b,#ff4f8b)',tag:'HOT',stock:{SSS:3,S:30,A:170,B:797},
  items:{SSS:[['🐉','황금룡 아우룸']],S:[['🔥','불꽃 와이번'],['🦖','고대 티라노']],A:[['🦎','번개 도마뱀'],['🐊','늪지 크로코'],['🪽','바람 그리폰']],B:[['🥚','드래곤 알'],['🦴','화석 조각'],['🪨','용암석']]}},
 {id:'star',name:'별빛 아이돌 오리파',cat:'아이돌',price:300,em:'🌟',bg:'linear-gradient(150deg,#a35bff,#5b8cff)',tag:'NEW',stock:{SSS:2,S:25,A:150,B:623},
  items:{SSS:[['👑','센터 퀸 루나']],S:[['🎤','메인보컬 하나'],['💃','댄스머신 리아']],A:[['🎧','DJ 소라'],['📸','포토카드 세트'],['🎀','리본 유니폼']],B:[['🎫','응원 티켓'],['🪄','응원봉'],['💌','팬레터']]}},
 {id:'sea',name:'딥씨 트레저 오리파',cat:'몬스터',price:200,em:'🐙',bg:'linear-gradient(150deg,#3fd0b0,#2f8fe0)',stock:{SSS:2,S:20,A:120,B:458},
  items:{SSS:[['🧜','바다의 여왕 세레나']],S:[['🦈','메가로돈'],['🐋','고래왕 모비']],A:[['🐙','크라켄 주니어'],['🐡','독복어'],['🦑','심해 오징어']],B:[['🐚','소라 껍데기'],['🦀','꽃게'],['⚓','녹슨 닻']]}},
 {id:'sweet',name:'디저트 파티 오리파',cat:'캐주얼',price:100,em:'🍰',bg:'linear-gradient(150deg,#ffcf5b,#ff8ab0)',tag:'입문',stock:{SSS:1,S:15,A:90,B:394},
  items:{SSS:[['🎂','레인보우 케이크']],S:[['🍫','황금 초콜릿'],['🍨','은하수 파르페']],A:[['🍩','글레이즈 도넛'],['🧁','딸기 컵케이크'],['🍮','캐러멜 푸딩']],B:[['🍪','쿠키'],['🍬','사탕'],['🍭','막대사탕']]}},
 {id:'cosmos',name:'코스믹 SSS 확정권',cat:'프리미엄',price:3000,em:'🪐',bg:'linear-gradient(150deg,#2b2140,#7a3cff)',tag:'S 이상 확정',stock:{SSS:5,S:45,A:0,B:0},
  items:{SSS:[['🌌','은하 수호자 오리온']],S:[['☄️','유성 기사'],['🛸','UFO 파일럿']],A:[],B:[]}},
 {id:'ninja',name:'닌자 배틀 오리파',cat:'캐주얼',price:200,em:'🥷',bg:'linear-gradient(150deg,#5d6886,#2b2140)',stock:{SSS:2,S:18,A:110,B:470},
  items:{SSS:[['🐉','칠흑의 쇼군']],S:[['⚔️','쌍검 카게'],['🦊','구미호 닌자']],A:[['🗡️','쿠나이 마스터'],['🎯','수리검'],['🏯','성의 자객']],B:[['🎋','대나무'],['🪵','통나무'],['🧣','두건']]}},
];
const S={pts:5000,inv:{},pulls:0,stock:{}};
try{const d=JSON.parse(localStorage.getItem('luckypack')||'null'); if(d) Object.assign(S,d);}catch(e){}
for(const p of PACKS) if(!S.stock[p.id]) S.stock[p.id]={...p.stock};
function save(){try{localStorage.setItem('luckypack',JSON.stringify(S))}catch(e){}}
const total=o=>GR.reduce((a,g)=>a+(o[g]||0),0);
function toast(t){let e=document.querySelector('.toast'); if(!e){e=document.createElement('div');e.className='toast';document.body.appendChild(e);} e.textContent=t; e.hidden=false; clearTimeout(e._t); e._t=setTimeout(()=>e.hidden=true,2000);}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* audio */
let AC; function au(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} else if(AC.state==='suspended') AC.resume(); }
function tone(f,d,{type='sine',v=.2,at=0,slide=0}={}){ if(!AC) return; const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(f*slide,t+d); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d); }
const sfx={tick(){tone(900,.05,{type:'square',v:.05})},rise(){tone(200,1.2,{type:'sawtooth',v:.07,slide:5})},
 pop(g){const base={B:392,A:523,S:659,SSS:784}[g]; const n={B:2,A:3,S:5,SSS:8}[g]; for(let i=0;i<n;i++) tone(base*Math.pow(1.122,i*2),.4,{type:'triangle',v:.18,at:i*.07});},
 flip(){tone(1200,.08,{type:'triangle',v:.08,slide:.5})}};

/* fx */
const cv=$('fx'),cx=cv.getContext('2d'); let parts=[],fxOn=false; const DPR=Math.min(2,devicePixelRatio||1);
function burst(n,cols){const w=innerWidth,h=innerHeight; for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*10; parts.push({x:w/2,y:h*.45,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,l:1,c:cols[i%cols.length],r:3+Math.random()*5,rot:Math.random()*6});}}
function loop(){ if(!fxOn) return; cv.width=innerWidth*DPR; cv.height=innerHeight*DPR; cx.scale(DPR,DPR);
 parts=parts.filter(p=>p.l>0); for(const p of parts){p.vy+=.18;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.l-=.012;p.rot+=.2; cx.globalAlpha=Math.max(0,p.l); cx.fillStyle=p.c; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillRect(-p.r,-p.r/2,p.r*2,p.r); cx.restore();}
 requestAnimationFrame(loop);}
const COLS={B:['#cfd6e8','#ffffff'],A:['#5ad6ff','#ffffff','#2f6fe0'],S:['#ffd54a','#fff6b0','#ff9a00'],SSS:['#ff5f8f','#ffb84a','#5fffb0','#5bb0ff','#c35bff','#fff']};

/* draw logic: real-stock oripa — draw without replacement */
function drawOne(p){ const st=S.stock[p.id]; const t=total(st); if(t<=0) return null; let r=Math.random()*t;
 for(const g of GR){ r-=st[g]; if(r<0){ st[g]--; const list=p.items[g]; const [em,nm]=list[Math.floor(Math.random()*list.length)]; return {g,em,nm,pack:p.id}; } } }
function cardHTML(c){return `<div class="tc g-${c.g}"><span class="gr">${c.g}</span><span class="em">${c.em}</span><span class="nm">${c.nm}</span></div>`;}

/* render */
let cat='전체';
function renderTop(){ $('pts').textContent=fmt(S.pts); }
function renderHome(){
 const cats=['전체',...new Set(PACKS.map(p=>p.cat))];
 $('chips').innerHTML=cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('');
 $('packs').innerHTML=PACKS.filter(p=>cat==='전체'||p.cat===cat).map(p=>{const st=S.stock[p.id],t=total(st),T=total(p.stock);
  return `<button class="pack" data-p="${p.id}"><div class="art" style="background:${p.bg}">${p.tag?`<span class="tag">${p.tag}</span>`:''}${st.SSS?`<span class="hot">SSS ${st.SSS}장 남음</span>`:''}${p.em}</div>
  <div class="info"><h3>${p.name}</h3><div class="price">${fmt(p.price)}P <small style="font-size:12px;color:var(--muted)">/ 1회</small></div><div class="bar"><i style="width:${t/T*100}%"></i></div><div class="left">잔여 ${fmt(t)} / ${fmt(T)}</div></div></button>`}).join('');
}
function renderBox(){
 const all=Object.values(S.inv); const cnt=g=>all.filter(c=>c.g===g).reduce((a,c)=>a+c.n,0);
 $('stats').innerHTML=GR.map(g=>`<div><b>${cnt(g)}</b><small>${g}</small></div>`).join('');
 const list=all.sort((a,b)=>GR.indexOf(a.g)-GR.indexOf(b.g));
 $('inv').innerHTML=list.length?list.map(c=>`<div class="it">${cardHTML(c)}${c.n>1?`<span class="ct">×${c.n}</span>`:''}</div>`).join(''):'<div class="empty" style="grid-column:1/-1">아직 뽑은 카드가 없어요.<br>오리파 탭에서 첫 팩을 뜯어보세요!</div>';
}
document.addEventListener('click',e=>{
 const c=e.target.closest('.chip'); if(c){cat=c.dataset.c; renderHome(); return;}
 const p=e.target.closest('.pack'); if(p){openSheet(PACKS.find(x=>x.id===p.dataset.p)); return;}
 const t=e.target.closest('.tabs button'); if(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b===t)); $('home').hidden=t.dataset.t!=='home'; $('box').hidden=t.dataset.t!=='box'; if(t.dataset.t==='box') renderBox(); scrollTo(0,0);}
});
$('charge').onclick=()=>{S.pts+=5000; save(); renderTop(); toast('5,000P 충전 완료 (체험용 포인트)');};
$('sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') $('sheet').hidden=true; });

function openSheet(p){
 const st=S.stock[p.id],t=total(st);
 const prizes=GR.flatMap(g=>p.items[g].map(([em,nm])=>({g,em,nm})));
 $('sheetIn').innerHTML=`<h2>${p.em} ${p.name}</h2><div class="left" style="font-size:13px">잔여 ${fmt(t)}장 · 1회 ${fmt(p.price)}P</div>
 <div class="odds">${GR.map(g=>`<div><b>${st[g]}</b><small>${g} 잔여</small></div>`).join('')}</div>
 <div class="sec" style="font-size:16px">수록 카드</div><div class="prizes">${prizes.map(cardHTML).join('')}</div>
 <div class="buy"><button class="btn" id="b1" ${t<1?'disabled':''}>1회 뽑기<small>${fmt(p.price)}P</small></button><button class="btn p" id="b10" ${t<10?'disabled':''}>10연 뽑기<small>${fmt(p.price*10)}P</small></button></div>`;
 $('sheetIn').querySelectorAll('.prizes .tc').forEach(e=>e.style.fontSize='15px');
 $('sheet').hidden=false;
 $('b1').onclick=()=>pull(p,1); $('b10').onclick=()=>pull(p,10);
}

async function pull(p,n){
 au(); if(S.pts<p.price*n){toast('포인트가 부족해요. 상단 충전 버튼을 눌러주세요'); return;}
 S.pts-=p.price*n; const got=[]; for(let i=0;i<n;i++){const c=drawOne(p); if(c) got.push(c);}
 for(const c of got){const k=c.pack+c.nm; S.inv[k]=S.inv[k]?{...S.inv[k],n:S.inv[k].n+1}:{...c,n:1};} S.pulls+=got.length; save(); renderTop();
 $('sheet').hidden=true;
 const best=got.reduce((a,c)=>GR.indexOf(c.g)<GR.indexOf(a.g)?c:a,got[0]);
 const stage=$('stage'),body=$('stageBody'),glow=$('glow'); stage.hidden=false; glow.className='glow';
 fxOn=true; parts=[]; requestAnimationFrame(loop);
 body.innerHTML=`<div class="packbig" id="pb" style="background:${p.bg}">${p.em}</div><div class="hint">팩을 탭해서 뜯기!</div>`;
 await new Promise(r=>$('pb').addEventListener('click',r,{once:true}));
 const pb=$('pb'); body.querySelector('.hint').textContent= best.g==='SSS'||best.g==='S' ? '…뭔가 심상치 않다!' : '두근두근…';
 pb.classList.add('shake'); sfx.rise();
 // tease: colour hint escalates for rare
 const steps=best.g==='SSS'?['B','A','S','SSS']:best.g==='S'?['B','A','S']:best.g==='A'?['B','A']:['B'];
 for(const g of steps){ glow.style.background=GCOL[g]; glow.className='glow'; glow.offsetWidth; glow.className='glow on'; buzz(30); for(let i=0;i<4;i++){sfx.tick(); await wait(110);} }
 pb.classList.remove('shake'); pb.classList.add('boom'); flash(); burst(best.g==='SSS'?220:best.g==='S'?120:50,COLS[best.g]); sfx.pop(best.g); buzz(best.g==='SSS'?[100,50,100,50,300]:60);
 await wait(400);
 if(n===1){
  const c=got[0];
  body.innerHTML=`<div class="reveal"><div class="flip" id="fl"><div class="fi">${cardHTML(c)}<div class="tc back">?</div></div></div><div class="grade ${c.g}" hidden id="gd">${c.g}</div><div class="cname" hidden id="cn">${c.em} ${c.nm}</div><div class="hint" id="h2">카드를 탭해서 뒤집기</div></div>`;
  await new Promise(r=>$('fl').addEventListener('click',r,{once:true}));
  $('fl').classList.add('open'); sfx.flip(); $('h2').remove(); await wait(450);
  $('gd').hidden=false; $('cn').hidden=false; burst(c.g==='SSS'?160:60,COLS[c.g]); sfx.pop(c.g); if(c.g==='SSS'){flash(); buzz([200,80,300]);}
 } else {
  body.innerHTML=`<div class="multi" id="mu">${got.map(c=>`<div class="slot"><div class="fi">${cardHTML(c)}<div class="back"></div></div></div>`).join('')}</div><div class="sumrow" id="sum">탭하면 한 번에 공개</div>`;
  const slots=[...$('mu').children]; let skip=false; $('mu').onclick=()=>skip=true;
  for(let i=0;i<slots.length;i++){ const c=got[i]; const rare=c.g==='S'||c.g==='SSS';
   if(rare&&!skip) await wait(350);
   slots[i].classList.add('open'); sfx.flip(); if(rare){slots[i].classList.add('hi'); sfx.pop(c.g); burst(c.g==='SSS'?120:50,COLS[c.g]); if(c.g==='SSS') flash();}
   await wait(skip?40:rare?500:170); }
  const cnt=g=>got.filter(c=>c.g===g).length;
  $('sum').textContent=GR.filter(cnt).map(g=>`${g} ${cnt(g)}장`).join(' · ');
 }
 const close=document.createElement('button'); close.className='btn p'; close.textContent='확인'; body.appendChild(close);
 const again=document.createElement('button'); again.className='btn'; again.textContent=`한 번 더 (${fmt(p.price*n)}P)`; body.appendChild(again);
 const end=()=>{stage.hidden=true; fxOn=false; renderHome();};
 close.onclick=end; again.onclick=()=>{end(); if(total(S.stock[p.id])>=n) pull(p,n); else toast('남은 수량이 부족해요');};
}
function flash(){const f=$('flash'); f.classList.remove('go'); f.offsetWidth; f.classList.add('go');}

renderTop(); renderHome();
</script>
