<title>럭키팩 오리파</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<style>
/* Layout: phone app shell — sticky point bar, live win feed, pack feed, 3 bottom tabs; pulls play full-screen */
:root{
  --bg:#f3eefe; --card:#ffffff; --ink:#2b2140; --muted:#8a7fa6; --line:rgba(138,127,166,.2);
  --pri:#ff4f8b; --pri-d:#c92c63; --mint:#3fd0b0; --sky:#5b8cff; --gold:#ffbf2e;
  --f-d:"Black Han Sans","Apple SD Gothic Neo",sans-serif; --f-u:"Jua","Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17122a;--card:#241c3d;--ink:#f4efff;--muted:#a99cc9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17122a;--card:#241c3d;--ink:#f4efff;--muted:#a99cc9;color-scheme:dark}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-u);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:12px 10px}
.logo{font-family:var(--f-d);font-size:26px;color:var(--pri);text-shadow:0 3px 0 rgba(201,44,99,.25)}
.logo span{color:var(--sky)}
.pt{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 6px 6px 12px;box-shadow:0 4px 0 rgba(43,33,64,.08)}
.pt b{font-family:var(--f-d);font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
.coin{width:20px;height:20px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 55%,#d48a00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.pt button{border:0;background:var(--pri);color:#fff;font:inherit;border-radius:999px;padding:5px 10px;cursor:pointer}
.feed{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:8px 12px;margin-bottom:12px;overflow:hidden;font-size:13px;box-shadow:0 3px 0 rgba(43,33,64,.06)}
.feed .live{flex:none;background:var(--pri);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px}
.feed .msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:fin .4s}
@keyframes fin{from{transform:translateY(100%);opacity:0}}
.feed .msg b{color:var(--pri);font-weight:400}
.banner{border-radius:22px;padding:18px;color:#fff;background:linear-gradient(120deg,#ff4f8b,#a35bff 55%,#5b8cff);box-shadow:0 8px 0 rgba(120,50,200,.25);position:relative;overflow:hidden;margin-bottom:16px;min-height:110px}
.banner h2{font-family:var(--f-d);font-weight:400;font-size:23px;margin:0 0 4px;text-wrap:balance;max-width:62%}
.banner p{margin:0;font-size:13px;opacity:.9;max-width:62%}
.banner .bm{position:absolute;right:6px;bottom:-6px;width:120px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.2))}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px}
.chip{flex:none;border:0;font:inherit;padding:7px 14px;border-radius:999px;background:var(--card);color:var(--muted);cursor:pointer;box-shadow:0 3px 0 rgba(43,33,64,.07)}
.chip.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pack{background:var(--card);border-radius:22px;overflow:hidden;cursor:pointer;box-shadow:0 6px 0 rgba(43,33,64,.08);transition:transform .12s;border:0;padding:0;font:inherit;color:inherit;text-align:left;position:relative}
.pack:active{transform:scale(.97)}
.pack .art{aspect-ratio:1/1.05;max-width:100%;position:relative;display:flex;align-items:center;justify-content:center}
.pack .art svg{width:70%}
.pack .tag{position:absolute;left:10px;top:10px;background:#fff;color:var(--pri);font-size:11px;padding:3px 8px;border-radius:999px}
.pack .hot{position:absolute;right:10px;top:10px;background:var(--ink);color:#fff;font-size:11px;padding:3px 8px;border-radius:999px}
.pack .info{padding:10px 12px 12px}
.pack h3{margin:0;font-size:15px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-family:var(--f-d);font-size:17px;color:var(--pri);margin-top:2px}
.price small{font-family:var(--f-u);font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sky));border-radius:99px}
.left{font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.sold{position:absolute;inset:0;background:rgba(20,12,40,.6);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--f-d);font-size:28px;transform:rotate(-8deg)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);display:flex;justify-content:center;box-shadow:0 -4px 20px rgba(43,33,64,.1);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs button{flex:1;max-width:140px;border:0;background:none;font:inherit;color:var(--muted);padding:10px 0 12px;cursor:pointer;font-size:13px}
.tabs button.on{color:var(--pri)}
.tabs button span{display:block;font-size:20px}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,12,40,.55);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sheet .in{background:var(--bg);width:100%;max-width:480px;border-radius:26px 26px 0 0;max-height:90%;overflow-y:auto;animation:up .3s cubic-bezier(.2,1.2,.4,1);
  padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@keyframes up{from{transform:translateY(100%)}}
.sheet h2{font-family:var(--f-d);font-weight:400;margin:0;font-size:22px}
.sec{font-family:var(--f-d);font-size:18px;margin:16px 0 10px}
.show{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px}
.show .tc{flex:none;width:120px;font-size:13px}
.odds{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.odds div{background:var(--card);border-radius:12px;padding:8px 4px;text-align:center}
.odds b{display:block;font-family:var(--f-d);font-weight:400;font-size:18px}
.odds small{color:var(--muted);font-size:11px}
.prizes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.prizes .tc{font-size:8px}
.buy{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;position:sticky;bottom:0;background:var(--bg);padding-top:8px}
.btn{border:0;font:inherit;font-size:16px;color:#fff;border-radius:16px;padding:13px 8px;cursor:pointer;background:var(--sky);box-shadow:0 5px 0 #3a63c9;transition:transform .08s}
.btn.p{background:var(--pri);box-shadow:0 5px 0 var(--pri-d)}
.btn.g{background:var(--mint);box-shadow:0 5px 0 #23977f}
.btn.k{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn small{display:block;font-size:12px;opacity:.85}
.btn:disabled{opacity:.45}
.pkgs{display:grid;gap:10px;margin-top:12px}
.pkg{display:flex;align-items:center;gap:10px;background:var(--card);border:0;font:inherit;color:inherit;border-radius:16px;padding:14px;cursor:pointer;box-shadow:0 4px 0 var(--line);text-align:left}
.pkg b{font-family:var(--f-d);font-weight:400;font-size:20px;flex:1}
.pkg em{font-style:normal;color:var(--pri);font-size:13px}
.pkg span.w{background:var(--ink);color:var(--bg);border-radius:10px;padding:6px 10px;font-size:14px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.field{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:13px;color:var(--muted)}
.field input{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}

/* trading card (original monsters) */
.tc{aspect-ratio:63/88;max-width:100%;border-radius:.7em;position:relative;overflow:hidden;padding:.35em;box-shadow:0 .3em 0 rgba(0,0,0,.18);color:#2b2140}
.tc .cf{height:100%;border-radius:.45em;background:#fffdf5;display:flex;flex-direction:column;overflow:hidden}
.tc .ch{display:flex;justify-content:space-between;align-items:baseline;padding:.25em .4em .1em;font-size:.72em;white-space:nowrap;gap:.3em}
.tc .ch span:first-child{overflow:hidden;text-overflow:ellipsis}
.tc .hp{font-family:var(--f-d);color:#d8343a;font-size:.85em;flex:none}
.tc .art{flex:1;margin:0 .3em;border-radius:.3em;background:radial-gradient(circle at 50% 40%,#fff,var(--tc));display:flex;align-items:center;justify-content:center;min-height:0;border:.12em solid rgba(0,0,0,.15)}
.tc .art svg{width:88%;height:auto;max-height:100%}
.tc .cb{display:flex;justify-content:space-between;align-items:center;padding:.2em .4em .3em;font-size:.6em}
.tc .ty{background:var(--tc);color:#fff;border-radius:99px;padding:0 .5em}
.tc .gr{font-family:var(--f-d)}
.g-B{background:linear-gradient(160deg,#d7dbe6,#9aa3bb)}
.g-A{background:linear-gradient(160deg,#7fe0ff,#2f6fe0)}
.g-S{background:linear-gradient(160deg,#ffe27a,#f08a00)}
.g-SSS{background:linear-gradient(135deg,#ff5f8f,#ffb84a,#5fffb0,#5bb0ff,#c35bff);background-size:300% 300%;animation:holo 2.5s linear infinite}
.g-LAST{background:linear-gradient(160deg,#3a2c1a,#111);box-shadow:0 0 0 .15em #ffd54a inset,0 .3em 0 rgba(0,0,0,.25)}
.g-LAST .cf{background:linear-gradient(#2b2140,#120c20);color:#ffd54a}
.g-SSS .cf::after,.g-LAST .cf::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.5) 47%,transparent 60%);background-size:250% 100%;animation:shine 2s linear infinite;pointer-events:none}
.g-S .art::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);background-size:250% 100%;animation:shine 2.4s linear infinite;pointer-events:none}
@keyframes holo{to{background-position:300% 0}}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}

/* pull stage */
.stage{position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 50% 45%,#3a2470,#0c0718);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.packbig{width:min(52vw,220px);aspect-ratio:3/4;border-radius:18px;position:relative;z-index:2;display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 0 rgba(0,0,0,.3),0 0 60px rgba(255,255,255,.2);cursor:pointer}
.packbig svg{width:75%}
.packbig::before{content:"";position:absolute;left:0;right:0;top:12%;height:6px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.8) 0 8px,transparent 8px 14px)}
.packbig .pn{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#fff;font-family:var(--f-d);font-size:15px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.packbig.shake{animation:pshake .12s infinite}
@keyframes pshake{0%{transform:rotate(-3deg) scale(1.02)}50%{transform:rotate(3deg) scale(1.05)}100%{transform:rotate(-3deg) scale(1.02)}}
.packbig.boom{animation:boom .45s forwards}
@keyframes boom{to{transform:scale(1.8);opacity:0;filter:brightness(3)}}
.hint{color:#fff;margin-top:22px;z-index:2;font-size:16px;animation:bl 1s infinite;text-align:center}
@keyframes bl{50%{opacity:.35}}
.glow{position:absolute;width:140vmax;height:140vmax;border-radius:50%;z-index:1;opacity:0;pointer-events:none}
.glow.on{animation:gl 1.2s ease-out forwards}
@keyframes gl{0%{opacity:0;transform:scale(.1)}30%{opacity:1}100%{opacity:.55;transform:scale(1)}}
.yokoku{position:fixed;inset:0;z-index:35;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column}
.yokoku b{font-family:var(--f-d);font-weight:400;font-size:clamp(70px,28vw,140px);color:#ffd54a;text-shadow:0 0 30px #ff4f8b,0 6px 0 #c92c63;animation:yk .5s cubic-bezier(.2,1.8,.4,1)}
.yokoku span{color:#fff;font-size:20px;margin-top:6px}
@keyframes yk{from{transform:scale(4) rotate(20deg);opacity:0}}
.cutin{position:fixed;left:-10%;right:-10%;top:42%;z-index:36;height:90px;display:flex;align-items:center;justify-content:center;transform:skewY(-6deg);
  font-family:var(--f-d);font-size:clamp(40px,13vw,64px);color:#fff;animation:cut 1.3s cubic-bezier(.2,.9,.3,1) forwards;pointer-events:none}
.cutin.S{background:linear-gradient(90deg,#f08a00,#ffd54a,#f08a00);text-shadow:0 4px 0 #a35a00}
.cutin.SSS{background:linear-gradient(90deg,#ff5f8f,#ffb84a,#5fffb0,#5bb0ff,#c35bff);text-shadow:0 4px 0 #5a1a6a,0 0 20px #fff}
.cutin.LAST{background:linear-gradient(90deg,#111,#3a2c1a,#111);color:#ffd54a;text-shadow:0 0 20px #ffd54a}
@keyframes cut{0%{transform:skewY(-6deg) translateX(110%)}25%{transform:skewY(-6deg) translateX(0)}75%{transform:skewY(-6deg) translateX(0);opacity:1}100%{transform:skewY(-6deg) translateX(-110%);opacity:0}}
.reveal{z-index:3;display:flex;flex-direction:column;align-items:center;gap:12px}
.flip{width:min(62vw,250px);perspective:900px;cursor:pointer}
.flip .fi,.multi .fi{position:relative;transition:transform .7s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d;transform:rotateY(180deg)}
.flip.open .fi,.multi .slot.open .fi{transform:none}
.flip .tc{font-size:26px}
.flip .tc,.multi .tc,.cback{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cback{position:absolute;inset:0;transform:rotateY(180deg);border-radius:.7em;background:radial-gradient(circle,#ff4f8b 0 18%,#fff 18% 24%,transparent 24%),repeating-linear-gradient(45deg,#2b2140 0 .5em,#3a2c5a .5em 1em);border:.3em solid #fff}
.grade{font-family:var(--f-d);font-size:clamp(46px,15vw,80px);line-height:1;color:#fff;animation:slam .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{from{transform:scale(3);opacity:0}}
.grade.B{text-shadow:0 5px 0 #6d7690}.grade.A{text-shadow:0 5px 0 #2f6fe0,0 0 30px #5ad6ff}.grade.S{text-shadow:0 5px 0 #b06000,0 0 40px #ffd54a}
.grade.SSS{background:linear-gradient(90deg,#ff5f8f,#ffb84a,#5fffb0,#5bb0ff,#c35bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 rgba(0,0,0,.4)) drop-shadow(0 0 20px #fff)}
.grade.LAST{color:#ffd54a;text-shadow:0 0 30px #ffd54a}
.cname{color:#fff;font-size:17px;text-align:center}
.multi{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:100%;max-width:440px;z-index:3}
.multi .slot{perspective:600px}
.multi .tc,.multi .cback{font-size:7.5px}
.multi .slot.hi .tc{box-shadow:0 0 0 2px #fff,0 0 18px #fff}
.sumrow{color:#fff;z-index:3;margin-top:14px;text-align:center;font-size:15px}
.sumrow b{color:var(--gold);font-weight:400}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:440px;z-index:3;margin-top:14px}
.acts .wide{grid-column:1/-1}
.flash{position:fixed;inset:0;background:#fff;z-index:40;pointer-events:none;opacity:0}
.flash.go{animation:fl .5s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}

/* inventory & ranking */
.inv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.inv .it{position:relative;border:0;padding:0;background:none;cursor:pointer}
.inv .tc{font-size:8.5px}
.inv .st{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);background:var(--mint);color:#fff;font-size:10px;border-radius:99px;padding:1px 6px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:40px 0;grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--card);border-radius:14px;padding:10px 6px;text-align:center}
.stats b{display:block;font-family:var(--f-d);font-size:18px;font-weight:400;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:12px}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.rank{display:flex;flex-direction:column;gap:8px}
.rk{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:0 3px 0 var(--line)}
.rk .n{font-family:var(--f-d);font-size:20px;width:28px;text-align:center}
.rk .n.m1{color:#e8a800}.rk .n.m2{color:#9aa3bb}.rk .n.m3{color:#c07a3a}
.rk .who{flex:1;min-width:0}
.rk .who small{display:block;color:var(--muted);font-size:12px}
.rk b{font-family:var(--f-d);font-weight:400;font-variant-numeric:tabular-nums}
.rk.me{outline:3px solid var(--pri)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:60;font-size:14px;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){.g-SSS,.g-SSS .cf::after,.g-LAST .cf::after,.g-S .art::after,.packbig.shake{animation:none}}
</style>

<div class="wrap">
  <div class="top">
    <div class="logo">럭키<span>팩</span></div>
    <div class="pt"><span class="coin"></span><b id="pts">0</b><button id="charge">충전</button></div>
  </div>
  <main id="home">
    <div class="feed"><span class="live">LIVE 데모</span><div class="msg" id="feed">당첨 소식을 불러오는 중…</div></div>
    <div class="banner"><h2>전설 오리파 라스트원 임박!</h2><p>마지막 1장을 뽑으면 LAST ONE 카드를 추가로 드려요</p><div class="bm" id="bannerMon"></div></div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="packs"></div>
  </main>
  <main id="box" hidden>
    <div class="sec" style="margin-top:4px">내 보관함</div>
    <div class="stats" id="stats"></div>
    <div class="filters" id="filters"></div>
    <div class="inv" id="inv"></div>
  </main>
  <main id="rank" hidden>
    <div class="sec" style="margin-top:4px">주간 뽑기 랭킹</div>
    <p class="note" style="margin-top:-4px">획득한 카드의 환원 가치 합계 기준이에요. 다른 플레이어는 데모 데이터예요.</p>
    <div class="rank" id="rankList"></div>
  </main>
</div>
<nav class="tabs"><button class="on" data-t="home"><span>🎴</span>오리파</button><button data-t="box"><span>🗃️</span>보관함</button><button data-t="rank"><span>🏆</span>랭킹</button></nav>

<div class="sheet" id="sheet" hidden><div class="in" id="sheetIn"></div></div>
<div class="stage" id="stage" hidden><canvas id="fx"></canvas><div class="glow" id="glow"></div><div id="stageBody" style="display:contents"></div></div>
<div class="flash" id="flash"></div>

<script>
const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const GR=['SSS','S','A','B'];
const GRANK=['LAST','SSS','S','A','B'];
const CONV={B:.3,A:1.2,S:8,SSS:50,LAST:30};
const TYPES={불:{c:'#ff7a45'},물:{c:'#3fa9ff'},풀:{c:'#4cc96b'},전기:{c:'#f5c400'},에스퍼:{c:'#c77dff'},드래곤:{c:'#6c63ff'},노말:{c:'#c9a77c'}};

/* audio */
let AC; function au(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} else if(AC.state==='suspended') AC.resume(); }
function tone(f,d,{type='sine',v=.2,at=0,slide=0}={}){ if(!AC) return; const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(f*slide,t+d); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d); }
const sfx={tick(){tone(900,.05,{type:'square',v:.05})},rise(){tone(200,1.4,{type:'sawtooth',v:.07,slide:5})},
 pop(g){const base={B:392,A:523,S:659,SSS:784,LAST:440}[g]; const n={B:2,A:3,S:5,SSS:8,LAST:7}[g]; for(let i=0;i<n;i++) tone(base*Math.pow(1.122,i*2),.4,{type:'triangle',v:.18,at:i*.07});},
 flip(){tone(1200,.08,{type:'triangle',v:.08,slide:.5})},
 boom(){tone(80,.6,{type:'sawtooth',v:.25,slide:.3}); tone(1600,.3,{type:'square',v:.06,slide:.2})},
 coin(){tone(1800,.08,{type:'square',v:.05}); tone(2600,.12,{v:.05,at:.04})}};

/* fx */
const cv=$('fx'),cx=cv.getContext('2d'); let parts=[],fxOn=false; const DPR=Math.min(2,devicePixelRatio||1);
function burst(n,cols){const w=innerWidth,h=innerHeight; for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*10; parts.push({x:w/2,y:h*.45,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,l:1,c:cols[i%cols.length],r:3+Math.random()*5,rot:Math.random()*6});}}
function loop(){ if(!fxOn) return; cv.width=innerWidth*DPR; cv.height=innerHeight*DPR; cx.scale(DPR,DPR);
 parts=parts.filter(p=>p.l>0); for(const p of parts){p.vy+=.18;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.l-=.012;p.rot+=.2; cx.globalAlpha=Math.max(0,p.l); cx.fillStyle=p.c; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillRect(-p.r,-p.r/2,p.r*2,p.r); cx.restore();}
 requestAnimationFrame(loop);}

 sheet(`<div style="width:min(60vw,220px);margin:0 auto;font-size:22px">${cardHTML(c)}</div>
 <h2 style="text-align:center;margin-top:14px">${c.g==='LAST'?'LAST ONE':c.g} ${m.n}</h2><div class="left" style="text-align:center;font-size:13px">${PK[c.pack].name} · 환원 가치 ${fmt(val(c))}P</div>
 <div class="buy"><button class="btn g" id="cv">포인트 환원<small>+${fmt(val(c))}P</small></button><button class="btn p" id="sh" ${c.ship?'disabled':''}>${c.ship?'배송 준비중':'배송 신청'}<small>${c.ship?'신청 완료':'실물 카드 받기'}</small></button></div>`);
 $('cv').onclick=()=>{ au(); S.pts+=val(c); S.inv=S.inv.filter(x=>x.uid!==uid); save(); renderTop(); sfx.coin(); $('sheet').hidden=true; renderBox(); toast(`${fmt(val(c))}P로 환원했어요`); };
 if(!c.ship) $('sh').onclick=()=>shipForm(c);
}
function shipForm(c){
 sheet(`<h2>배송 신청</h2><div class="note">체험판이에요. 입력한 정보는 어디에도 전송되지 않아요.</div>
 <form id="sf"><label class="field">받는 분<input id="sfName" required placeholder="홍길동"></label><label class="field">연락처<input id="sfTel" required inputmode="tel" placeholder="010-0000-0000"></label><label class="field">주소<input id="sfAddr" required placeholder="서울시 ○○구 ○○로 12"></label>
 <div class="buy"><button type="button" class="btn k" id="sfCancel">취소</button><button class="btn p">신청하기<small>배송비 0P</small></button></div></form>`);
 $('sfCancel').onclick=()=>openCard(c.uid);
 $('sf').onsubmit=e=>{ e.preventDefault(); c.ship=true; save(); $('sheet').hidden=true; renderBox(); toast('배송 신청 완료 · 배송 준비중으로 바뀌었어요'); };
}

/* pull */
function flash(){const f=$('flash'); f.classList.remove('go'); f.offsetWidth; f.classList.add('go');}
function cutin(g,text){ const d=document.createElement('div'); d.className='cutin '+g; d.textContent=text; document.body.appendChild(d); setTimeout(()=>d.remove(),1400); }
async function yokoku(){ const d=document.createElement('div'); d.className='yokoku'; d.innerHTML='<b>!?</b><span>대박 예고…</span>'; document.body.appendChild(d); buzz([50,50,50]); tone(110,.6,{type:'sawtooth',v:.2}); await wait(1100); d.remove(); flash(); }
async function pull(p,n){
 au(); const cost=p.price*n; if(S.pts<cost){toast('포인트가 부족해요. 상단 충전 버튼을 눌러주세요'); return;}
 S.pts-=cost; const got=[]; let last=false;
 for(let i=0;i<n;i++){const c=drawOne(p); if(c){got.push(c); if(total(S.stock[p.id])===0) last=true;}}
 if(last) got.push({g:'LAST',mon:p.last,pack:p.id});
 for(const c of got){ c.uid=S.uid++; S.earned+=val(c); }
 S.inv.push(...got); save(); renderTop();
 $('sheet').hidden=true;
 const best=got.reduce((a,c)=>GRANK.indexOf(c.g)<GRANK.indexOf(a.g)?c:a,got[0]);
 const bg=best.g==='LAST'?'SSS':best.g;
 const stage=$('stage'),body=$('stageBody'),glow=$('glow'); stage.hidden=false; glow.className='glow';
 fxOn=true; parts=[]; requestAnimationFrame(loop);
 body.innerHTML=`<div class="packbig" id="pb" style="background:${p.bg}">${monSVG(p.mon)}<span class="pn">${p.name}</span></div><div class="hint">팩을 탭해서 뜯기!</div>`;
 await new Promise(r=>$('pb').addEventListener('click',r,{once:true}));
 const pb=$('pb'); const hint=body.querySelector('.hint');
 hint.textContent=(bg==='SSS'||bg==='S')?'…뭔가 심상치 않다!':'두근두근…';
 pb.classList.add('shake'); sfx.rise();
 const steps=bg==='SSS'?['B','A','S','SSS']:bg==='S'?['B','A','S']:bg==='A'?['B','A']:['B'];
 for(const g of steps){ glow.style.background=GCOL[g]; glow.className='glow'; glow.offsetWidth; glow.className='glow on'; buzz(30); for(let i=0;i<4;i++){sfx.tick(); await wait(110);} }
 if(bg==='SSS' || (bg==='S'&&Math.random()<.5)) await yokoku();
 pb.classList.remove('shake'); pb.classList.add('boom'); flash(); sfx.boom(); burst(bg==='SSS'?220:bg==='S'?120:50,COLS[bg]); buzz(bg==='SSS'?[100,50,100,50,300]:60);
 if(bg==='SSS'||bg==='S') cutin(bg, bg==='SSS'?'SSS 확정!!!':'S 이상 확정!');
 await wait(bg==='SSS'||bg==='S'?1200:400);
 if(n===1){
  const c=got[0];
  body.innerHTML=`<div class="reveal"><div class="flip" id="fl"><div class="fi">${cardHTML(c)}<div class="cback" style="font-size:26px"></div></div></div><div class="grade ${c.g}" hidden id="gd">${c.g}</div><div class="cname" hidden id="cn">${MONS[c.mon].n} · 환원 ${fmt(val(c))}P</div><div class="hint" id="h2">카드를 탭해서 뒤집기</div></div><div id="acts" class="acts"></div>`;
  await new Promise(r=>$('fl').addEventListener('click',r,{once:true}));
  $('fl').classList.add('open'); sfx.flip(); $('h2').remove(); await wait(450);
  $('gd').hidden=false; $('cn').hidden=false; burst(c.g==='SSS'?160:60,COLS[c.g]); sfx.pop(c.g); if(c.g==='SSS'){flash(); buzz([200,80,300]);}
 } else {
  body.innerHTML=`<div class="multi" id="mu">${got.map(c=>`<div class="slot"><div class="fi">${cardHTML(c)}<div class="cback"></div></div></div>`).join('')}</div><div class="sumrow" id="sum">탭하면 한 번에 공개</div><div id="acts" class="acts"></div>`;
  const slots=[...$('mu').children]; let skip=false; $('mu').onclick=()=>skip=true;
  for(let i=0;i<slots.length;i++){ const c=got[i]; const rare=c.g==='S'||c.g==='SSS'||c.g==='LAST';
   if(rare&&!skip) await wait(350);
   slots[i].classList.add('open'); sfx.flip();
   if(rare){slots[i].classList.add('hi'); sfx.pop(c.g); burst(c.g==='S'?50:120,COLS[c.g]); if(c.g!=='S'){flash(); cutin(c.g,c.g==='LAST'?'LAST ONE 획득!':'SSS!!!');}}
   await wait(skip?40:rare?(c.g==='S'?500:1300):170); }
  const cnt=g=>got.filter(c=>c.g===g).length;
  $('sum').innerHTML=GRANK.filter(cnt).map(g=>`${g==='LAST'?'LAST ONE':g} ${cnt(g)}장`).join(' · ')+`<br>총 환원 가치 <b>${fmt(got.reduce((a,c)=>a+val(c),0))}P</b>`;
 }
 if(last){ toast('🎉 라스트원 획득! LAST ONE 카드가 보관함에 들어갔어요'); }
 const acts=$('acts'); const uids=new Set(got.map(c=>c.uid));
 const lows=()=>S.inv.filter(c=>uids.has(c.uid)&&(c.g==='B'||c.g==='A'));
 const end=()=>{stage.hidden=true; fxOn=false; renderHome();};
 const mk=(cls,html,fn)=>{const b=document.createElement('button'); b.className='btn '+cls; b.innerHTML=html; b.onclick=fn; acts.appendChild(b); return b;};
 const lowV=lows().reduce((a,c)=>a+val(c),0);
 if(lowV) mk('g','B·A 일괄 환원<small>+'+fmt(lowV)+'P</small>',e=>{ const v=lows().reduce((a,c)=>a+val(c),0); S.inv=S.inv.filter(c=>!(uids.has(c.uid)&&(c.g==='B'||c.g==='A'))); S.pts+=v; save(); renderTop(); sfx.coin(); toast(`${fmt(v)}P 환원 완료`); e.currentTarget.disabled=true; });
 mk('k','보관함에 보관<small>나중에 환원·배송</small>',end);
 const left=total(S.stock[p.id]); const nn=Math.min(n,left);
 const again=mk('p wide',left?`한 번 더 ${nn}연<small>${fmt(p.price*nn)}P</small>`:'SOLD OUT',()=>{end(); pull(p,nn);});
 if(!left) again.disabled=true;
 if(!lowV) again.classList.remove('wide');
}

renderTop(); renderHome();
</script>
