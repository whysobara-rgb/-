<title>네온 램페이지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
/* Layout: full-bleed canvas arena; HUD hugs the top edge, overlays center */
:root{--bg:#07060f;--ink:#f2f0ff;--muted:#9a93c9;--hot:#ff2e88;--cy:#2ef2ff;--lime:#b6ff3b;--gold:#ffd23b;--f:"Black Han Sans","Apple SD Gothic Neo",sans-serif;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;pointer-events:none;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.xp{height:8px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--lime));box-shadow:0 0 12px var(--cy)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:15px;text-shadow:0 2px 0 #000}
.row b{font-weight:400;color:var(--gold)}
.hp{width:120px;height:10px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff2e5a,var(--hot));transition:width .15s}
.ov{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(7,6,15,.78);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov h1{font-weight:400;font-size:clamp(44px,14vw,84px);line-height:.95;margin:0;color:var(--hot);text-shadow:0 0 24px var(--hot),4px 4px 0 var(--cy)}
.ov p{color:var(--muted);font-family:system-ui,sans-serif;font-size:15px;max-width:32ch;margin:14px 0 0}
.go{margin-top:26px;border:0;font:inherit;font-size:24px;color:#07060f;background:var(--lime);padding:14px 40px;border-radius:14px;box-shadow:0 6px 0 #5a8a00,0 0 30px rgba(182,255,59,.5);cursor:pointer}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #5a8a00}
.cards{display:grid;gap:12px;width:100%;max-width:380px;margin-top:18px}
.card{border:2px solid rgba(46,242,255,.5);background:linear-gradient(135deg,#16123a,#0d0b22);color:var(--ink);font:inherit;border-radius:16px;padding:14px 16px;text-align:left;display:flex;gap:14px;align-items:center;cursor:pointer;animation:cin .35s backwards}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
@keyframes cin{from{transform:translateY(40px) scale(.9);opacity:0}}
.card .ic{font-size:30px;width:44px;text-align:center}
.card b{display:block;font-weight:400;font-size:19px}
.card small{color:var(--muted);font-family:system-ui,sans-serif;font-size:13px}
.card .lv{color:var(--gold);font-size:13px;margin-left:6px}
.card.new{border-color:var(--gold);box-shadow:0 0 20px rgba(255,210,59,.35)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stats div{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 14px;font-size:22px}
.stats small{display:block;font-family:system-ui,sans-serif;font-size:11px;color:var(--muted)}
.lvtitle{font-size:clamp(36px,11vw,60px);color:var(--lime);text-shadow:0 0 24px var(--lime)}
</style>

<canvas id="c"></canvas>
<div class="hud">
  <div class="xp"><i id="xpb"></i></div>
  <div class="row"><div class="hp"><i id="hpb"></i></div><span id="tm">0:00</span><span>LV <b id="lv">1</b> · 💀 <b id="kl">0</b></span></div>
</div>
<div class="ov" id="ovStart"><h1>NEON<br>RAMPAGE</h1><p>화면 아무 데나 대고 드래그해서 이동. 공격은 자동. 몰려오는 놈들을 갈아버리고 레벨업으로 미쳐 날뛰세요.</p><button class="go" id="bStart">시작</button><p id="best"></p></div>
<div class="ov" id="ovLv" hidden><div class="lvtitle">LEVEL UP!</div><div class="cards" id="cards"></div></div>
<div class="ov" id="ovEnd" hidden><h1>WASTED</h1><div class="stats" id="endStats"></div><button class="go" id="bAgain">다시 하기</button></div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
addEventListener('resize',resize);resize();
const R=Math.random, TAU=Math.PI*2;
const $=id=>document.getElementById(id);

/* audio */
let AC;function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}else if(AC.state==='suspended')AC.resume();}
let lastSnd={};
function tone(f,d,type='square',v=.06,slide=0,key){if(!AC)return;const now=AC.currentTime;if(key){if(lastSnd[key]&&now-lastSnd[key]<.03)return;lastSnd[key]=now;}
 const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,now);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),now+d);
 g.gain.setValueAtTime(v,now);g.gain.exponentialRampToValueAtTime(.0001,now+d);o.connect(g);g.connect(AC.destination);o.start(now);o.stop(now+d);}
function noise(d,v=.15,key){if(!AC)return;const now=AC.currentTime;if(key){if(lastSnd[key]&&now-lastSnd[key]<.04)return;lastSnd[key]=now;}
 const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(R()*2-1)*Math.pow(1-i/c.length,2);
 const s=AC.createBufferSource();s.buffer=b;const g=AC.createGain();g.gain.value=v;s.connect(g);g.connect(AC.destination);s.start();}
const sfx={shoot:()=>tone(880,.04,'square',.025,.5,'sh'),hit:()=>noise(.05,.12,'hit'),kill:()=>{tone(220,.12,'sawtooth',.06,.3,'kl');noise(.08,.15)},
 gem:p=>tone(600+p*40,.07,'triangle',.06,0,'gm'),hurt:()=>{tone(120,.25,'sawtooth',.15,.4);noise(.2,.25)},
 lvl:()=>[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.18,'square',.07),i*60)),
 nova:()=>{tone(90,.4,'sawtooth',.12,.4);noise(.3,.2)},zap:()=>tone(1400,.1,'sawtooth',.04,.3,'zp'),boss:()=>{tone(60,1.2,'sawtooth',.2,.5);noise(1,.3)}};
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* state */
let G;
function newGame(){
 G={t:0,kills:0,lv:1,xp:0,xpNext:4,combo:0,comboT:0,shake:0,hitstop:0,slow:1,flash:0,over:false,paused:false,
  p:{x:0,y:0,vx:0,vy:0,r:14,hp:100,maxHp:100,spd:230,inv:0,magnet:90,face:0},
  st:{dmg:10,rate:2.2,multi:1,pierce:0,crit:.08,orbs:0,nova:0,zap:0,steal:0,bspd:620},
  lvls:{},
  en:[],bu:[],gems:[],parts:[],txt:[],rings:[],bolts:[],
  fireT:0,novaT:0,zapT:0,spawnT:0,eliteT:40,bossT:90,orbA:0,announce:null};
}
/* input: floating joystick */
const joy={on:false,sx:0,sy:0,x:0,y:0};const keys={};
cv.addEventListener('pointerdown',e=>{joy.on=true;joy.sx=joy.x=e.clientX;joy.sy=joy.y=e.clientY;au();});
addEventListener('pointermove',e=>{if(joy.on){joy.x=e.clientX;joy.y=e.clientY;}});
addEventListener('pointerup',()=>joy.on=false);addEventListener('pointercancel',()=>joy.on=false);
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

/* enemies */
const ET={
 grunt:{r:13,hp:18,spd:95,dmg:8,col:'#ff2e88',xp:1},
 fast:{r:10,hp:10,spd:175,dmg:6,col:'#ffd23b',xp:1},
 tank:{r:22,hp:90,spd:62,dmg:15,col:'#9b5cff',xp:4},
 elite:{r:30,hp:500,spd:85,dmg:20,col:'#ff6a2e',xp:25},
 boss:{r:56,hp:4000,spd:70,dmg:30,col:'#ff0040',xp:120},
};
function spawn(type,scale){const t=ET[type],a=R()*TAU,d=Math.max(W,H)*.55+R()*60;
 G.en.push({type,x:G.p.x+Math.cos(a)*d,y:G.p.y+Math.sin(a)*d,vx:0,vy:0,r:t.r,hp:t.hp*scale,max:t.hp*scale,spd:t.spd*(0.9+R()*.2),dmg:t.dmg,col:t.col,xp:t.xp,fl:0,wob:R()*6});}
function nearest(x,y,skip){let b=null,bd=1e12;for(const e of G.en){if(e.dead||(skip&&skip.has(e)))continue;const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;b=e;}}return b;}

/* damage + juice */
function hurtEnemy(e,dmg,kx,ky,forceCrit){
 if(e.dead)return;const crit=forceCrit||R()<G.st.crit;if(crit)dmg*=2.5;
 e.hp-=dmg;e.fl=.08;const kb=e.type==='boss'?.15:e.type==='elite'?.4:1;e.vx+=kx*kb;e.vy+=ky*kb;
 G.txt.push({x:e.x+(R()-.5)*14,y:e.y-e.r,v:Math.round(dmg),t:.7,crit});
 sfx.hit();for(let i=0;i<(crit?6:3);i++)G.parts.push(part(e.x,e.y,crit?'#ffd23b':'#fff',3,260));
 if(crit){G.hitstop=Math.max(G.hitstop,.03);G.shake=Math.max(G.shake,4);}
 if(e.hp<=0)kill(e);
}
function part(x,y,c,s,sp){const a=R()*TAU,v=sp*(.3+R()*.7);return{x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c,s:s*(.6+R()*.8),t:.35+R()*.35,max:.7};}
function kill(e){
 e.dead=true;G.kills++;G.combo++;G.comboT=1.6;sfx.kill();
 const n=e.type==='boss'?80:e.type==='elite'?40:12;for(let i=0;i<n;i++)G.parts.push(part(e.x,e.y,i%3?e.col:'#fff',e.r/4+2,e.r*14));
 G.rings.push({x:e.x,y:e.y,r:e.r,max:e.r*3,t:.3,c:e.col});
 if(e.type==='boss'||e.type==='elite'){G.hitstop=e.type==='boss'?.35:.12;G.shake=e.type==='boss'?30:14;G.flash=.25;buzz(e.type==='boss'?[80,40,200]:60);announce(e.type==='boss'?'BOSS DOWN!!':'ELITE SLAIN!');}
 else{G.shake=Math.max(G.shake,2.5);}
 let xp=e.xp;while(xp>0){const v=xp>=10?10:xp>=4?4:1;xp-=v;G.gems.push({x:e.x+(R()-.5)*e.r,y:e.y+(R()-.5)*e.r,v,pull:false});}
 if(G.st.steal&&R()<G.st.steal)G.p.hp=Math.min(G.p.maxHp,G.p.hp+2);
 const c=G.combo;if(c===25)announce('KILLING SPREE');if(c===60)announce('RAMPAGE!');if(c===120)announce('UNSTOPPABLE!!');if(c===250)announce('GODLIKE!!!');
}
function announce(t){G.announce={t,life:1.4};}

/* upgrades */
const UP=[
 {id:'dmg',ic:'⚔️',n:'날카로운 탄',d:'공격력 +30%',f:s=>s.dmg*=1.3},
 {id:'rate',ic:'⚡',n:'광속 연사',d:'연사 속도 +25%',f:s=>s.rate*=1.25},
 {id:'multi',ic:'🔱',n:'멀티샷',d:'탄 +1발',f:s=>s.multi++},
 {id:'pierce',ic:'🗡️',n:'관통',d:'탄이 적 1명 더 관통',f:s=>s.pierce++},
 {id:'crit',ic:'💥',n:'치명타',d:'치명타 확률 +10%',f:s=>s.crit+=.1},
 {id:'orbs',ic:'🌀',n:'회전 칼날',d:'몸 주위를 도는 칼날 +1',f:s=>s.orbs++},
 {id:'nova',ic:'💫',n:'충격파',d:'주기적으로 주변을 폭발시킴 (레벨업마다 강화)',f:s=>s.nova++},
 {id:'zap',ic:'🌩️',n:'연쇄 번개',d:'적 사이를 튀는 번개 (레벨업마다 연쇄 +2)',f:s=>s.zap++},
 {id:'spd',ic:'👟',n:'질주',d:'이동 속도 +12%',f:(s,p)=>p.spd*=1.12},
 {id:'hp',ic:'❤️',n:'강철 심장',d:'최대 체력 +25, 전부 회복',f:(s,p)=>{p.maxHp+=25;p.hp=p.maxHp}},
 {id:'mag',ic:'🧲',n:'자석',d:'경험치 흡수 범위 +50%',f:(s,p)=>p.magnet*=1.5},
 {id:'steal',ic:'🩸',n:'흡혈',d:'처치 시 확률적으로 체력 회복',f:s=>s.steal+=.15},
];
function levelUp(){
 G.lv++;G.xp-=G.xpNext;G.xpNext=Math.floor(G.xpNext*1.28+4);sfx.lvl();buzz(40);
 G.paused=true;G.rings.push({x:G.p.x,y:G.p.y,r:10,max:400,t:.5,c:'#b6ff3b'});
 const pool=UP.slice().sort(()=>R()-.5).slice(0,3);
 $('cards').innerHTML='';
 for(const u of pool){const lv=G.lvls[u.id]||0;const b=document.createElement('button');b.className='card'+(lv===0&&(u.id==='orbs'||u.id==='nova'||u.id==='zap')?' new':'');
  b.innerHTML=`<span class="ic">${u.ic}</span><span><b>${u.n}<span class="lv">${lv?'Lv'+(lv+1):'NEW'}</span></b><small>${u.d}</small></span>`;
  b.onclick=()=>{u.f(G.st,G.p);G.lvls[u.id]=lv+1;$('ovLv').hidden=true;G.paused=false;G.slow=.25;if(G.xp>=G.xpNext)setTimeout(levelUp,250);};
  $('cards').appendChild(b);}
 setTimeout(()=>$('ovLv').hidden=false,180);
}

/* update */
function update(dt){
 const p=G.p,s=G.st;G.t+=dt;
 // move
 let mx=0,my=0;if(joy.on){const dx=joy.x-joy.sx,dy=joy.y-joy.sy,d=Math.hypot(dx,dy);if(d>6){const k=Math.min(1,d/50);mx=dx/d*k;my=dy/d*k;}}
 if(keys.w||keys.arrowup)my=-1;if(keys.s||keys.arrowdown)my=1;if(keys.a||keys.arrowleft)mx=-1;if(keys.d||keys.arrowright)mx=1;
 const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
 p.vx+=(mx*p.spd-p.vx)*Math.min(1,dt*14);p.vy+=(my*p.spd-p.vy)*Math.min(1,dt*14);p.x+=p.vx*dt;p.y+=p.vy*dt;
 if(ml>.1&&R()<.6)G.parts.push({x:p.x,y:p.y,vx:0,vy:0,c:'#2ef2ff',s:4,t:.25,max:.25});
 p.inv-=dt;
 // spawn
 const min=G.t/60;G.spawnT-=dt;
 if(G.spawnT<=0){G.spawnT=Math.max(.1,.55-min*.12);const scale=1+min*.45;const n=2+Math.floor(min*2);
  for(let i=0;i<n;i++){const r=R();spawn(min>1.2&&r<.15?'tank':min>.5&&r<.4?'fast':'grunt',scale);} }
 G.eliteT-=dt;if(G.eliteT<=0){G.eliteT=40;spawn('elite',1+min*.5);announce('ELITE INCOMING');}
 G.bossT-=dt;if(G.bossT<=0){G.bossT=90;spawn('boss',1+min*.6);announce('⚠ BOSS ⚠');sfx.boss();G.shake=20;buzz([100,50,100]);}
 // fire
 G.fireT-=dt;
 if(G.fireT<=0){const t=nearest(p.x,p.y);if(t&&(t.x-p.x)**2+(t.y-p.y)**2<520**2){G.fireT=1/s.rate;const a0=Math.atan2(t.y-p.y,t.x-p.x);p.face=a0;
  for(let i=0;i<s.multi;i++){const a=a0+(i-(s.multi-1)/2)*.16;G.bu.push({x:p.x,y:p.y,vx:Math.cos(a)*s.bspd,vy:Math.sin(a)*s.bspd,t:1,pierce:s.pierce,hit:new Set()});}
  sfx.shoot();G.shake=Math.max(G.shake,1);}}
 // bullets
 for(const b of G.bu){b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;
  for(const e of G.en){if(e.dead||b.hit.has(e))continue;if((e.x-b.x)**2+(e.y-b.y)**2<(e.r+5)**2){b.hit.add(e);const l=Math.hypot(b.vx,b.vy);hurtEnemy(e,s.dmg,b.vx/l*220,b.vy/l*220);if(b.pierce--<=0){b.t=0;break;}}}}
 G.bu=G.bu.filter(b=>b.t>0);
 // orbs
 G.orbA+=dt*4.2;if(s.orbs){const rr=70;for(let i=0;i<s.orbs;i++){const a=G.orbA+i*TAU/s.orbs,ox=p.x+Math.cos(a)*rr,oy=p.y+Math.sin(a)*rr;
  for(const e of G.en){if(e.dead)continue;if((e.x-ox)**2+(e.y-oy)**2<(e.r+12)**2&&(e.oc||0)<=G.t){e.oc=G.t+.25;hurtEnemy(e,s.dmg*.9,(e.x-p.x)*3,(e.y-p.y)*3);}}}}
 // nova
 if(s.nova){G.novaT-=dt;if(G.novaT<=0){G.novaT=Math.max(1.2,3.2-s.nova*.35);const rad=110+s.nova*30;sfx.nova();G.shake=Math.max(G.shake,7);
  G.rings.push({x:p.x,y:p.y,r:20,max:rad,t:.35,c:'#2ef2ff',w:10});
  for(const e of G.en){const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<rad+e.r)hurtEnemy(e,s.dmg*(1.5+s.nova*.5),(e.x-p.x)/d*600,(e.y-p.y)/d*600);}}}
 // zap
 if(s.zap){G.zapT-=dt;if(G.zapT<=0){G.zapT=Math.max(.5,1.4-s.zap*.12);let from={x:p.x,y:p.y};const hit=new Set();const pts=[[p.x,p.y]];
  for(let i=0;i<1+s.zap*2;i++){const e=nearest(from.x,from.y,hit);if(!e||Math.hypot(e.x-from.x,e.y-from.y)>260)break;hit.add(e);pts.push([e.x,e.y]);hurtEnemy(e,s.dmg*1.4,0,0);from=e;}
  if(pts.length>1){G.bolts.push({pts,t:.18});sfx.zap();}}}
 // enemies
 for(const e of G.en){if(e.dead)continue;const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;
  e.vx+=(dx/d*e.spd-e.vx)*Math.min(1,dt*3);e.vy+=(dy/d*e.spd-e.vy)*Math.min(1,dt*3);e.x+=e.vx*dt;e.y+=e.vy*dt;e.fl-=dt;
  if(d<e.r+p.r&&p.inv<=0){p.hp-=e.dmg;p.inv=.6;G.shake=12;G.flash=.2;G.hitstop=.06;sfx.hurt();buzz(80);G.combo=0;
   for(const o of G.en){const od=Math.hypot(o.x-p.x,o.y-p.y)||1;if(od<120){o.vx+=(o.x-p.x)/od*500;o.vy+=(o.y-p.y)/od*500;}}
   if(p.hp<=0){gameOver();return;}}
  if(d>Math.max(W,H)*1.4&&e.type!=='boss'&&e.type!=='elite'){const a=R()*TAU,r=Math.max(W,H)*.6;e.x=p.x+Math.cos(a)*r;e.y=p.y+Math.sin(a)*r;}}
 // separation (cheap)
 const en=G.en;for(let i=0;i<en.length;i+=1){const a=en[i];for(let j=i+1;j<Math.min(en.length,i+12);j++){const b=en[j];const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r,d2=dx*dx+dy*dy;if(d2<rr*rr&&d2>0){const d=Math.sqrt(d2),o=(rr-d)/2;a.x-=dx/d*o;a.y-=dy/d*o;b.x+=dx/d*o;b.y+=dy/d*o;}}}
 G.en=G.en.filter(e=>!e.dead);
 // gems
 for(const g of G.gems){const dx=p.x-g.x,dy=p.y-g.y,d=Math.hypot(dx,dy);if(d<p.magnet)g.pull=true;
  if(g.pull){const sp=Math.max(380,900-d);g.x+=dx/d*sp*dt;g.y+=dy/d*sp*dt;}
  if(d<p.r+6){g.got=true;G.xp+=g.v;sfx.gem(Math.min(20,G.combo%20));}}
 G.gems=G.gems.filter(g=>!g.got);if(G.gems.length>400)G.gems.splice(0,G.gems.length-400);
 if(G.xp>=G.xpNext&&!G.paused)levelUp();
 G.comboT-=dt;if(G.comboT<=0)G.combo=0;
}
function updFx(dt){
 for(const q of G.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.9;q.vy*=.9;q.t-=dt;}G.parts=G.parts.filter(q=>q.t>0);if(G.parts.length>900)G.parts.splice(0,G.parts.length-900);
 for(const t of G.txt){t.y-=50*dt;t.t-=dt;}G.txt=G.txt.filter(t=>t.t>0);
 for(const r of G.rings){r.t-=dt;r.r+=(r.max-r.r)*Math.min(1,dt*14);}G.rings=G.rings.filter(r=>r.t>0);
 for(const b of G.bolts)b.t-=dt;G.bolts=G.bolts.filter(b=>b.t>0);
 G.shake*=Math.pow(.003,dt);G.flash-=dt;if(G.announce){G.announce.life-=dt;if(G.announce.life<=0)G.announce=null;}
}

/* draw */
function draw(){
 const p=G.p;ctx.setTransform(DPR,0,0,DPR,0,0);
 ctx.fillStyle='#07060f';ctx.fillRect(0,0,W,H);
 const sx=(R()-.5)*G.shake*2,sy=(R()-.5)*G.shake*2;const cx=W/2-p.x+sx,cy=H/2-p.y+sy;
 // grid
 ctx.strokeStyle='rgba(120,90,255,.12)';ctx.lineWidth=1;const gs=60,ox=((cx%gs)+gs)%gs,oy=((cy%gs)+gs)%gs;ctx.beginPath();
 for(let x=ox;x<W;x+=gs){ctx.moveTo(x,0);ctx.lineTo(x,H);}for(let y=oy;y<H;y+=gs){ctx.moveTo(0,y);ctx.lineTo(W,y);}ctx.stroke();
 ctx.save();ctx.translate(cx,cy);
 // gems
 for(const g of G.gems){ctx.fillStyle=g.v>=10?'#ff2e88':g.v>=4?'#b6ff3b':'#2ef2ff';const s=g.v>=10?7:g.v>=4?5.5:4;ctx.beginPath();ctx.moveTo(g.x,g.y-s);ctx.lineTo(g.x+s*.7,g.y);ctx.lineTo(g.x,g.y+s);ctx.lineTo(g.x-s*.7,g.y);ctx.fill();}
 ctx.globalCompositeOperation='lighter';
 for(const r of G.rings){ctx.strokeStyle=r.c;ctx.globalAlpha=Math.max(0,r.t*3);ctx.lineWidth=r.w||4;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke();}
 ctx.globalAlpha=1;
 for(const q of G.parts){ctx.globalAlpha=Math.max(0,q.t/q.max);ctx.fillStyle=q.c;ctx.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s);}
 ctx.globalAlpha=1;
 // bullets
 ctx.strokeStyle='#fff8b0';ctx.lineWidth=5;ctx.lineCap='round';ctx.shadowColor='#ffd23b';ctx.shadowBlur=12;
 ctx.beginPath();for(const b of G.bu){ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.025,b.y-b.vy*.025);}ctx.stroke();
 // bolts
 ctx.strokeStyle='#a8f6ff';ctx.shadowColor='#2ef2ff';ctx.lineWidth=3;for(const b of G.bolts){ctx.globalAlpha=b.t/.18;ctx.beginPath();ctx.moveTo(b.pts[0][0],b.pts[0][1]);
  for(let i=1;i<b.pts.length;i++){const [x0,y0]=b.pts[i-1],[x1,y1]=b.pts[i];for(let k=1;k<=4;k++){const t=k/4;ctx.lineTo(x0+(x1-x0)*t+(k<4?(R()-.5)*18:0),y0+(y1-y0)*t+(k<4?(R()-.5)*18:0));}}ctx.stroke();}
 ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.globalCompositeOperation='source-over';
 // enemies
 for(const e of G.en){const w=Math.sin(G.t*10+e.wob)*.08;ctx.save();ctx.translate(e.x,e.y);ctx.scale(1+w,1-w);
  ctx.fillStyle=e.fl>0?'#fff':e.col;ctx.shadowColor=e.col;ctx.shadowBlur=e.type==='boss'||e.type==='elite'?24:10;
  if(e.type==='fast'){ctx.beginPath();ctx.moveTo(e.r,0);ctx.lineTo(-e.r,-e.r*.8);ctx.lineTo(-e.r*.5,0);ctx.lineTo(-e.r,e.r*.8);ctx.rotate(0);ctx.fill();}
  else if(e.type==='tank'||e.type==='boss'){ctx.beginPath();for(let i=0;i<6;i++){const a=i*TAU/6+G.t*(e.type==='boss'?1:.4);ctx.lineTo(Math.cos(a)*e.r,Math.sin(a)*e.r);}ctx.fill();}
  else{ctx.beginPath();ctx.arc(0,0,e.r,0,TAU);ctx.fill();}
  ctx.shadowBlur=0;ctx.fillStyle='#07060f';const a=Math.atan2(p.y-e.y,p.x-e.x);ctx.beginPath();ctx.arc(Math.cos(a)*e.r*.35-e.r*.18,Math.sin(a)*e.r*.35,e.r*.16,0,TAU);ctx.arc(Math.cos(a)*e.r*.35+e.r*.18,Math.sin(a)*e.r*.35,e.r*.16,0,TAU);ctx.fill();
  ctx.restore();
  if(e.type==='boss'||e.type==='elite'){ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(e.x-e.r,e.y-e.r-14,e.r*2,6);ctx.fillStyle='#ff2e5a';ctx.fillRect(e.x-e.r,e.y-e.r-14,e.r*2*Math.max(0,e.hp/e.max),6);}}
 // orbs
 if(G.st.orbs){ctx.fillStyle='#2ef2ff';ctx.shadowColor='#2ef2ff';ctx.shadowBlur=18;for(let i=0;i<G.st.orbs;i++){const a=G.orbA+i*TAU/G.st.orbs;ctx.save();ctx.translate(p.x+Math.cos(a)*70,p.y+Math.sin(a)*70);ctx.rotate(G.orbA*3);
  ctx.beginPath();for(let k=0;k<4;k++){const b=k*TAU/4;ctx.lineTo(Math.cos(b)*13,Math.sin(b)*13);ctx.lineTo(Math.cos(b+.4)*4,Math.sin(b+.4)*4);}ctx.fill();ctx.restore();}ctx.shadowBlur=0;}
 // player
 if(!(p.inv>0&&Math.floor(G.t*20)%2)){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.face);ctx.shadowColor='#b6ff3b';ctx.shadowBlur=22;ctx.fillStyle='#b6ff3b';
  ctx.beginPath();ctx.moveTo(p.r+4,0);ctx.lineTo(-p.r,-p.r);ctx.lineTo(-p.r*.4,0);ctx.lineTo(-p.r,p.r);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(2,0,4,0,TAU);ctx.fill();ctx.restore();}
 ctx.beginPath();ctx.strokeStyle='rgba(46,242,255,.08)';ctx.lineWidth=1;ctx.arc(p.x,p.y,p.magnet,0,TAU);ctx.stroke();
 // dmg text
 ctx.textAlign='center';for(const t of G.txt){ctx.globalAlpha=Math.min(1,t.t*3);ctx.font=`${t.crit?26:16}px "Black Han Sans",sans-serif`;ctx.lineWidth=4;ctx.strokeStyle='#000';ctx.strokeText(t.v,t.x,t.y);ctx.fillStyle=t.crit?'#ffd23b':'#fff';ctx.fillText(t.v,t.x,t.y);}
 ctx.globalAlpha=1;ctx.restore();
 // joystick
 if(joy.on){ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(joy.sx,joy.sy,50,0,TAU);ctx.stroke();const dx=joy.x-joy.sx,dy=joy.y-joy.sy,d=Math.min(50,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);
  ctx.fillStyle='rgba(182,255,59,.5)';ctx.beginPath();ctx.arc(joy.sx+Math.cos(a)*d,joy.sy+Math.sin(a)*d,22,0,TAU);ctx.fill();}
 // combo + announce
 if(G.combo>=5){const s=1+Math.min(.6,G.combo/200);ctx.save();ctx.translate(W-16,H*.2);ctx.rotate(-.08);ctx.textAlign='right';ctx.font=`${Math.round(30*s)}px "Black Han Sans",sans-serif`;
  ctx.fillStyle=G.combo>=60?'#ff2e88':'#ffd23b';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=16;ctx.fillText(G.combo+' COMBO',0,0);ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(-120,10,120*Math.max(0,G.comboT/1.6),4);ctx.restore();}
 if(G.announce){const a=G.announce,k=1.4-a.life;const sc=k<.15?3-k/.15*2:1;ctx.save();ctx.translate(W/2,H*.32);ctx.scale(sc,sc);ctx.globalAlpha=Math.min(1,a.life*2);
  ctx.textAlign='center';ctx.font=`${Math.min(64,W/8)}px "Black Han Sans",sans-serif`;ctx.lineWidth=8;ctx.strokeStyle='#000';ctx.strokeText(a.t,0,0);ctx.fillStyle='#ff2e88';ctx.shadowColor='#ff2e88';ctx.shadowBlur=30;ctx.fillText(a.t,0,0);ctx.restore();}
 if(G.flash>0){ctx.fillStyle=`rgba(255,${G.p.inv>0?40:255},${G.p.inv>0?80:255},${G.flash*1.6})`;ctx.fillRect(0,0,W,H);}
 // vignette when low hp
 if(p.hp<p.maxHp*.3){const gr=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.7);gr.addColorStop(0,'rgba(255,0,60,0)');gr.addColorStop(1,`rgba(255,0,60,${.25+Math.sin(G.t*8)*.1})`);ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);}
}
function hud(){$('xpb').style.width=Math.min(100,G.xp/G.xpNext*100)+'%';$('hpb').style.width=Math.max(0,G.p.hp/G.p.maxHp*100)+'%';
 const t=Math.floor(G.t);$('tm').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');$('lv').textContent=G.lv;$('kl').textContent=G.kills;}

let last=0,running=false;
function frame(now){const raw=Math.min(.05,(now-last)/1000||0);last=now;
 if(running&&!G.over){
  if(G.hitstop>0){G.hitstop-=raw;}
  else if(!G.paused){G.slow=Math.min(1,G.slow+raw*2);update(raw*G.slow);}
  updFx(raw);draw();hud();}
 requestAnimationFrame(frame);}
function gameOver(){G.over=true;running=false;sfx.boss();buzz([200,100,400]);
 let best=0;try{best=+localStorage.getItem('neonBest')||0;if(G.t>best)localStorage.setItem('neonBest',G.t);}catch(e){}
 const t=Math.floor(G.t);$('endStats').innerHTML=`<div>${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}<small>생존 시간</small></div><div>${G.kills}<small>처치</small></div><div>${G.lv}<small>레벨</small></div>`;
 setTimeout(()=>$('ovEnd').hidden=false,600);}
function start(){au();newGame();for(let i=0;i<18;i++)spawn(i%4?'grunt':'fast',1);for(const e of G.en){const a=R()*TAU,d=260+R()*120;e.x=Math.cos(a)*d;e.y=Math.sin(a)*d;}$('ovStart').hidden=true;$('ovEnd').hidden=true;running=true;}
$('bStart').onclick=start;$('bAgain').onclick=start;
try{const b=+localStorage.getItem('neonBest');if(b)$('best').textContent=`최고 기록 ${Math.floor(b/60)}:${String(Math.floor(b%60)).padStart(2,'0')}`;}catch(e){}
newGame();requestAnimationFrame(frame);
// 시작 화면 뒤에 살짝 보이는 데모 아레나
for(let i=0;i<25;i++)spawn('grunt',1);for(const e of G.en){e.x=(R()-.5)*W;e.y=(R()-.5)*H;}draw();
</script>
