<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>괴이 사업자교육</title>
<style>
:root{--bg:#07070a;--fg:#e8e2d4;--dim:#8a8478;--red:#c8323a;--amber:#e0b04a;--panel:rgba(12,10,14,.94);--line:#3a3340}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:960px;height:600px;transform-origin:center}
canvas{display:block;width:960px;height:600px;image-rendering:pixelated;background:#000}
.ov{position:absolute;inset:0;display:none}
.show{display:flex!important}
#hud{position:absolute;left:12px;top:10px;font-size:13px;color:var(--dim);pointer-events:none;text-shadow:0 0 4px #000;line-height:1.6}
#hud b{color:var(--amber)}
#gauge{position:absolute;right:14px;top:12px;width:200px;display:none;font-size:12px}
#gauge .bar{height:8px;background:#222;border:1px solid #555;margin-top:3px}
#gauge .fill{height:100%;background:var(--red);width:0}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:13px;color:var(--amber);pointer-events:none;text-shadow:0 0 4px #000}
#dlg{position:absolute;left:24px;right:24px;bottom:18px;background:var(--panel);border:1px solid var(--line);padding:16px 20px 14px;display:none;min-height:120px;box-shadow:0 0 40px #000}
#dlg .who{color:var(--amber);font-weight:700;font-size:14px;margin-bottom:6px;letter-spacing:.05em}
#dlg .txt{font-size:16px;line-height:1.7;white-space:pre-wrap}
#dlg .more{position:absolute;right:16px;bottom:8px;font-size:11px;color:var(--dim)}
#dlg .opts{margin-top:10px;display:flex;flex-direction:column;gap:6px}
#dlg .opt{padding:8px 12px;border:1px solid var(--line);cursor:pointer;font-size:15px;background:#120f16}
#dlg .opt.sel{border-color:var(--amber);background:#2a2014;color:#fff}
#dlg .opt.lock{opacity:.4}
.screen{flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#16101a 0%,#050407 70%);text-align:center;padding:30px}
.screen h1{font-size:40px;margin:0 0 6px;letter-spacing:.12em;font-weight:900}
.screen h1 span{color:var(--red)}
.screen .sub{color:var(--dim);font-size:14px;margin-bottom:28px;line-height:1.7}
.menu{display:flex;flex-direction:column;gap:8px;min-width:300px}
.btn{padding:10px 18px;border:1px solid var(--line);background:#0e0b11;color:var(--fg);font-size:15px;cursor:pointer;font-family:inherit}
.btn.sel,.btn:hover{border-color:var(--amber);color:#fff;background:#221a12}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:820px}
.grid .btn{text-align:left;font-size:13px;line-height:1.5;padding:9px 12px}
.grid .btn small{color:var(--dim)}
.grid .btn .st{float:right;color:var(--amber)}
#fail{flex-direction:column;align-items:center;justify-content:center;background:#000;text-align:center}
#fail .case{color:var(--red);font-size:15px;letter-spacing:.2em;margin-bottom:12px}
#fail .loc{color:var(--dim);font-size:14px;margin-bottom:18px}
#fail .msg{font-size:24px;line-height:1.6;max-width:760px;margin-bottom:10px;font-weight:700}
#fail .big{font-size:56px;color:var(--red);font-weight:900;letter-spacing:.3em;margin:18px 0 26px;text-shadow:0 0 18px #800}
#note{flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.88)}
#note .paper{background:#e9e1cc;color:#2a2218;width:560px;padding:30px 34px;font-family:"Noto Serif KR",serif;font-size:16px;line-height:1.9;box-shadow:0 0 50px #000;transform:rotate(-1deg);white-space:pre-wrap}
#note .paper h3{margin:0 0 10px;font-size:14px;color:#7a2a20;letter-spacing:.1em}
#post{background:#f3f3f3;color:#222;flex-direction:column;align-items:stretch;justify-content:flex-start;overflow:auto;font-size:14px}
#post .bar{background:#3b4890;color:#fff;padding:10px 18px;font-weight:700}
#post .body{padding:18px 28px;line-height:1.8;white-space:pre-wrap}
#post .meta{color:#666;font-size:12px;border-bottom:1px solid #ccc;padding-bottom:8px;margin-bottom:12px}
#post h2{margin:0 0 4px;font-size:18px}
input.name{background:#000;border:1px solid var(--amber);color:#fff;font-size:18px;padding:8px 12px;font-family:inherit;width:260px;text-align:center}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<canvas id="cv" width="960" height="600"></canvas>
<div id="hud"></div>
<div id="gauge"><span id="glab">애착</span><div class="bar"><div class="fill" id="gfill"></div></div></div>
<div id="hint"></div>
<div id="dlg"><div class="who"></div><div class="txt"></div><div class="opts"></div><div class="more">SPACE / 클릭</div></div>
<div id="title" class="ov screen"></div>
<div id="select" class="ov screen"></div>
<div id="fail" class="ov"></div>
<div id="note" class="ov"></div>
<div id="post" class="ov"></div>
</div></div>
<script>
"use strict";
/* ============================================================
   괴이 사업자교육 — 원작: 나폴리탄 괴담 갤러리 「사업자교육」 사례집
   조작: WASD 이동 / SPACE·마우스 선택·상호작용 / M 실습장 선택
   ============================================================ */
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const T=40,W=24,H=15;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- 저장 ---------- */
const SAVE_KEY='goei_biz_edu_v1';
let SV={clear:{},seen:{},pages:{},ending:null};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s)SV=Object.assign(SV,s);}catch(e){}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(SV));}catch(e){}}
const clearedCount=()=>Object.keys(SV.clear).filter(k=>k!=='0').length;

/* ---------- 오디오 (절차적) ---------- */
let AC=null,drone=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function beep(f=440,d=.08,type='square',v=.05){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d);}
function setDrone(on,base=55){const a=audio();if(!a)return;if(drone){try{drone.forEach(n=>n.stop());}catch(e){}drone=null;}if(!on)return;
  const g=a.createGain();g.gain.value=.025;g.connect(a.destination);drone=[];
  [base,base*1.5,base*2.02].forEach(f=>{const o=a.createOscillator();o.type='sawtooth';o.frequency.value=f;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;o.connect(lp).connect(g);o.start();drone.push(o);});}
function noiseBurst(d=.4,v=.08){const a=audio();if(!a)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=a.createBufferSource(),g=a.createGain();g.gain.value=v;s.buffer=b;s.connect(g).connect(a.destination);s.start();}

/* ---------- 입력 ---------- */
const keys={};let spaceHit=false,mouse=null;
addEventListener('keydown',e=>{audio();const k=e.key.toLowerCase();keys[k]=true;if(k===' '){spaceHit=true;e.preventDefault();}
  if(k==='m'&&mode==='play'&&!dlgBusy)openSelect();
  if(k==='escape'&&mode==='play'&&!dlgBusy)openSelect();
  menuKey(k);});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
cv.addEventListener('mousedown',e=>{audio();const r=cv.getBoundingClientRect();const sc=960/r.width;mouse={x:(e.clientX-r.left)*sc,y:(e.clientY-r.top)*sc};});
function fit(){const s=Math.min(innerWidth/960,innerHeight/600);$('stage').style.transform=`scale(${s})`;}
addEventListener('resize',fit);fit();

/* ---------- 대화 시스템 ---------- */
let dlgBusy=false,dlgResolve=null,dlgOpts=null,dlgSel=0;
const D=$('dlg');
function say(who,txt){return new Promise(res=>{dlgBusy=true;D.style.display='block';D.querySelector('.who').textContent=who||'';D.querySelector('.txt').textContent=txt;D.querySelector('.opts').innerHTML='';D.querySelector('.more').style.display='block';dlgOpts=null;spaceHit=false;beep(660,.03,'square',.02);
  dlgResolve=()=>{D.style.display='none';dlgBusy=false;res();};});}
async function talk(lines){for(const l of lines){await say(l[0],l[1]);}}
function choose(who,txt,opts){return new Promise(res=>{dlgBusy=true;D.style.display='block';D.querySelector('.who').textContent=who||'';D.querySelector('.txt').textContent=txt;D.querySelector('.more').style.display='none';
  const box=D.querySelector('.opts');box.innerHTML='';dlgOpts=[];dlgSel=0;spaceHit=false;
  opts.forEach((o,i)=>{const el=document.createElement('div');el.className='opt'+(o.lock?' lock':'');el.textContent=(o.lock?'🔒 ':'▸ ')+(o.lock?o.lockText||'(단서가 부족하다)':o.t);
    el.onmouseenter=()=>{dlgSel=i;paintOpts();};el.onclick=()=>pick(i);box.appendChild(el);dlgOpts.push({el,o});});
  const first=dlgOpts.findIndex(x=>!x.o.lock);dlgSel=first<0?0:first;paintOpts();
  function pick(i){if(dlgOpts[i].o.lock){beep(120,.1,'square',.04);return;}beep(880,.04,'square',.03);D.style.display='none';dlgBusy=false;dlgOpts=null;res(i);}
  dlgResolve=pick;});}
function paintOpts(){if(!dlgOpts)return;dlgOpts.forEach((x,i)=>x.el.classList.toggle('sel',i===dlgSel));}
D.addEventListener('click',()=>{if(dlgBusy&&!dlgOpts&&dlgResolve)dlgResolve();});
function menuKey(k){
  if(dlgBusy&&dlgOpts){if(k==='w'||k==='arrowup'){do{dlgSel=(dlgSel-1+dlgOpts.length)%dlgOpts.length;}while(dlgOpts[dlgSel].o.lock&&dlgOpts.some(x=>!x.o.lock));paintOpts();}
    if(k==='s'||k==='arrowdown'){do{dlgSel=(dlgSel+1)%dlgOpts.length;}while(dlgOpts[dlgSel].o.lock&&dlgOpts.some(x=>!x.o.lock));paintOpts();}
    if(k===' '){spaceHit=false;dlgResolve(dlgSel);}return;}
  if(dlgBusy&&!dlgOpts&&k===' '){spaceHit=false;dlgResolve&&dlgResolve();return;}
  if(menuNav&&mode==='menu')menuNav(k);
}
let menuNav=null;
function bindMenu(container){const bs=[...container.querySelectorAll('.btn')];let i=0;const paint=()=>bs.forEach((b,j)=>b.classList.toggle('sel',j===i));paint();
  bs.forEach((b,j)=>b.onmouseenter=()=>{i=j;paint();});
  const cols=container.querySelector('.grid')?3:1;
  menuNav=k=>{if(k==='w'||k==='arrowup')i=Math.max(0,i-cols);if(k==='s'||k==='arrowdown')i=Math.min(bs.length-1,i+cols);if(k==='a'||k==='arrowleft')i=Math.max(0,i-1);if(k==='d'||k==='arrowright')i=Math.min(bs.length-1,i+1);paint();if(k===' '){spaceHit=false;bs[i].click();}};}

/* ---------- 게임 상태 ---------- */
let mode='title';     // title | play | cut | menu
let map=null,P={x:0,y:0,dir:1,step:0},F={},tm=0,gauge=null;
const hudEl=$('hud'),hintEl=$('hint');

/* ---------- 그리기 도우미 ---------- */
function drawPerson(c,x,y,s,col,o={}){ // 인간
  c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(0,16,10,4,0,0,7);c.fill();
  c.fillStyle=col||'#8a7f70';c.fillRect(-7,-4,14,16);
  c.fillStyle=o.leg||'#2a2a33';c.fillRect(-6,10,5,7);c.fillRect(1,10,5,7);
  c.fillStyle=o.skin||'#e1c4a4';c.beginPath();c.arc(0,-10,7,0,7);c.fill();
  c.fillStyle=o.hair||'#2a1f18';c.beginPath();c.arc(0,-12,7,Math.PI,0);c.fill();
  c.fillStyle='#111';c.fillRect(-3,-11,2,2);c.fillRect(2,-11,2,2);
  if(o.smile){c.strokeStyle='#622';c.beginPath();c.arc(0,-7,3,0,Math.PI);c.stroke();}
  c.restore();}
function drawGhoul(c,x,y,s,o={}){ // 괴이
  c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(0,17,11,4,0,0,7);c.fill();
  c.fillStyle=o.col||'#141018';c.beginPath();c.moveTo(-11,17);c.quadraticCurveTo(-13,-22,0,-22);c.quadraticCurveTo(13,-22,11,17);
  for(let i=0;i<5;i++)c.lineTo(11-i*5.5,17-(i%2?5:0));c.fill();
  c.fillStyle=o.eye||'#f4f0e0';c.beginPath();c.arc(-4,-9,2.3,0,7);c.arc(4,-9,2.3,0,7);c.fill();
  if(o.mouth){c.fillStyle='#600';c.fillRect(-4,-3,8,2+o.mouth);}
  c.restore();}
function drawPlayer(c,x,y){ // 수강생 4444 — 그림자가 있다
  c.save();c.fillStyle='rgba(0,0,0,.55)';c.beginPath();c.ellipse(x+4,y+17,13,5,0,0,7);c.fill();c.restore();
  const bob=Math.sin(P.step*10)*1.2;
  drawGhoul(c,x,y+bob,1,{col:'#1d1724',eye:'#ffd86a'});
  c.fillStyle='#ffd86a';c.font='bold 9px sans-serif';c.textAlign='center';c.fillText('4444',x,y-26+bob);}
function emoji(c,e,x,y,sz=24){c.font=`${sz}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(e,x,y);c.textBaseline='alphabetic';}

/* ---------- 맵 빌더 ---------- */
function mk(def){
  const g=[];for(let y=0;y<H;y++){g.push([]);for(let x=0;x<W;x++)g[y].push(x===0||y===0||x===W-1||y===H-1?1:0);}
  (def.walls||[]).forEach(([x,y,w,h])=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(g[j]&&g[j][i]!==undefined)g[j][i]=1;});
  (def.gaps||[]).forEach(([x,y])=>{g[y][x]=0;});
  def.grid=g;def.objs=def.objs||[];return def;}
function solidAt(px,py){const tx=Math.floor(px/T),ty=Math.floor(py/T);if(tx<0||ty<0||tx>=W||ty>=H)return true;if(map.grid[ty][tx])return true;
  for(const o of map.objs){if(o.solid!==false&&!o.hidden&&Math.abs(o.x*T+T/2-px)<T*.45&&Math.abs(o.y*T+T/2-py)<T*.45)return true;}return false;}
function collide(nx,ny){const r=11;return solidAt(nx-r,ny-r)||solidAt(nx+r,ny-r)||solidAt(nx-r,ny+r)||solidAt(nx+r,ny+r);}
function nearObj(){let best=null,bd=1e9;for(const o of map.objs){if(o.hidden||!o.act)continue;const d=Math.hypot(o.x*T+T/2-P.x,o.y*T+T/2-P.y);if(d<T*1.45&&d<bd){bd=d;best=o;}}return best;}

/* ---------- 컷신 (실패 영상) ---------- */
let cut=null;
function playCut(shots,caseNo){return new Promise(res=>{mode='cut';menuNav=null;cut={shots,i:0,t:0,res,caseNo,skip:false};setDrone(true,41);noiseBurst(.6,.1);});}
function drawCut(dt){
  const s=cut.shots[cut.i];cut.t+=dt;
  cx.save();cx.fillStyle='#000';cx.fillRect(0,0,960,600);
  const jit=Math.random()<.04?(Math.random()*14-7):0;cx.translate(jit,0);
  cx.save();cx.beginPath();cx.rect(0,60,960,480);cx.clip();
  s.draw(cx,Math.min(1,cut.t/s.d),cut.t);
  cx.restore();
  // 자막
  if(s.cap){cx.font='bold 22px "Noto Sans KR",sans-serif';cx.textAlign='center';const k=Math.min(s.cap.length,Math.floor(cut.t*22));
    cx.fillStyle='rgba(0,0,0,.6)';cx.fillRect(80,486,800,42);cx.fillStyle='#fff';cx.fillText(s.cap.slice(0,k),480,515);}
  cx.restore();
  // VHS 오버레이
  for(let y=60;y<540;y+=3){cx.fillStyle='rgba(0,0,0,.18)';cx.fillRect(0,y,960,1);}
  for(let i=0;i<220;i++){cx.fillStyle=`rgba(255,255,255,${Math.random()*.08})`;cx.fillRect(Math.random()*960,60+Math.random()*480,2,1);}
  if(Math.random()<.06){const yy=60+Math.random()*480;cx.fillStyle='rgba(255,255,255,.08)';cx.fillRect(0,yy,960,8+Math.random()*20);}
  const vg=cx.createRadialGradient(480,300,180,480,300,560);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.75)');cx.fillStyle=vg;cx.fillRect(0,60,960,480);
  cx.font='16px monospace';cx.textAlign='left';cx.fillStyle=(Math.floor(tm*2)%2)?'#f33':'#700';cx.fillText('● REC',24,90);
  cx.fillStyle='#ddd';cx.fillText(`괴이사업자교육 · 사례 ${cut.caseNo} 재연영상`,110,90);
  cx.textAlign='right';const d=new Date(2024,2,4,3,13,Math.floor(tm)%60);cx.fillText(`PLAY ▶  ${d.toTimeString().slice(0,8)}`,936,90);
  cx.font='12px monospace';cx.fillStyle='#888';cx.fillText('[SPACE: 건너뛰기]',936,560);
  if(spaceHit){spaceHit=false;cut.i=cut.shots.length-1;cut.t=cut.shots[cut.i].d;}
  if(cut.t>=s.d+.6){cut.i++;cut.t=0;noiseBurst(.15,.05);if(cut.i>=cut.shots.length){const r=cut.res;cut=null;setDrone(false);r();}}
}
/* 컷신용 배경 */
const bgs={
  apt(c,t){c.fillStyle='#0b1220';c.fillRect(0,60,960,480);for(let i=0;i<7;i++){c.fillStyle='#161d2c';c.fillRect(40+i*130,140,100,400);for(let y=0;y<14;y++)for(let x=0;x<4;x++){c.fillStyle=Math.sin(i*7+y*3+x)>.3?'#e8c870':'#1c2335';c.fillRect(52+i*130+x*22,160+y*26,14,14);}}},
  elev(c){c.fillStyle='#2b2a2e';c.fillRect(0,60,960,480);c.fillStyle='#55545a';c.fillRect(300,100,360,420);c.fillStyle='#8c8b90';c.fillRect(310,110,170,400);c.fillRect(480,110,170,400);c.fillStyle='#111';c.fillRect(479,110,2,400);c.fillStyle='#e33';c.font='bold 30px monospace';c.textAlign='center';c.fillText('B4',480,96);},
  market(c){c.fillStyle='#1b0d0d';c.fillRect(0,60,960,480);for(let i=0;i<6;i++){c.fillStyle='#3a1414';c.fillRect(i*170,100,150,260);c.fillStyle='#d23';c.fillRect(i*170,100,150,24);c.fillStyle='#e9a';for(let k=0;k<3;k++){c.beginPath();c.ellipse(i*170+40+k*36,190,12,30,0,0,7);c.fill();}}c.fillStyle='#ff4';c.fillRect(0,96,960,2);},
  park(c,t){c.fillStyle='#08281c';c.fillRect(0,60,960,480);c.fillStyle='#1f5d8a';c.fillRect(0,330,960,210);for(let i=0;i<12;i++){c.fillStyle='#0f4a2c';c.beginPath();c.moveTo(i*90,330);c.lineTo(i*90+45,150+Math.sin(i)*30);c.lineTo(i*90+90,330);c.fill();}c.strokeStyle='#6ab';for(let i=0;i<8;i++){c.beginPath();c.arc((i*140+t*80)%960,420,20,0,Math.PI);c.stroke();}},
  church(c){c.fillStyle='#090910';c.fillRect(0,60,960,480);c.fillStyle='#1d1d26';c.fillRect(320,140,320,400);c.fillStyle='#e8d9a0';c.fillRect(470,160,20,70);c.fillRect(450,180,60,16);c.fillStyle='#3b3226';c.fillRect(420,360,120,80);c.fillStyle='#ffe9a8';c.fillRect(440,375,80,40);},
  gosi(c){c.fillStyle='#14120e';c.fillRect(0,60,960,480);for(let i=0;i<9;i++){c.fillStyle='#24201a';c.fillRect(20+i*104,120,90,250);c.fillStyle='#6b6050';c.fillRect(64+i*104,240,6,6);}c.fillStyle='#c0392b';c.fillRect(0,380,960,6);},
  campus(c){c.fillStyle='#101418';c.fillRect(0,60,960,480);c.fillStyle='#2b3138';c.fillRect(200,120,560,420);for(let y=0;y<6;y++)for(let x=0;x<8;x++){c.fillStyle='#0b0e12';c.fillRect(230+x*66,140+y*60,40,36);}c.fillStyle='#ddd';c.font='bold 24px serif';c.textAlign='center';c.fillText('大 學 院',480,112);},

function bigText(c,txt,y,col='#fff',sz=40){c.font=`900 ${sz}px "Noto Sans KR",sans-serif`;c.textAlign='center';c.fillStyle='rgba(0,0,0,.6)';c.fillText(txt,483,y+3);c.fillStyle=col;c.fillText(txt,480,y);}

  <div class="menu"><button class="btn" id="fr">다시 실습</button><button class="btn" id="fs">실습장 선택</button><button class="btn" id="fh">교육장으로</button></div>`;
  f.classList.add('show');mode='menu';bindMenu(f);

}

function showNote(h,txt){return new Promise(res=>{const n=$('note');n.innerHTML=`<div class="paper"><h3>${h}</h3>${txt}</div><div style="margin-top:18px;color:#8a8478;font-size:13px">주머니에서 찢어진 수첩 한 장이 나왔다. 언제 넣었는지 기억나지 않는다. — SPACE / 클릭</div>`;n.classList.add('show');mode='menu';beep(220,.3,'sine',.05);

  await talk([['','펜 끝에서 이름이 흘러나온다. 세 글자가, 수정액 아래에서 떠오르듯.'],['','「'+name+'」'],['계단 선배','…역시. 처음부터 맛이 이상하더라니. 사람 냄새가.'],['계단 선배','괴이수칙기록원이로군. 이름을 지우고 들어와서, 우리 교육을 처음부터 끝까지 받아 갔어.'],['계단 선배','잡아먹으면 그만이지만… 이름을 되찾은 인간은 못 먹는다. 그게 규칙이다. 우리가 만든.'],['계단 선배','가라. 그리고 가서 적어라. 우리가 어떻게 망하는지. 어차피 다들 웃고 말 테니까.'],['','교육장의 형광등이 하나씩 꺼진다. 계단이 하나 줄어드는 소리가 난다. 열셋에서, 열둘로.'],['','눈을 뜬다. 손에는 핸드폰. 화면에는 글 하나.']]);
  SV.ending='human';save();showPost(name);}
function showPost(name){mode='menu';const p=$('post');
  p.innerHTML=`<div class="bar">나폴리탄 괴담 마이너 갤러리</div><div class="body"><h2>사업자교육</h2><div class="meta">${name} · 조회 23876 · 추천 444</div>│사업자교육이란?

올해는 괴이가 해선 안되는 실수를 모았습니다.
사업지 선정부터 다양한 인간상에 대하여 사업장을 가진 괴이라면 이 교육을 반드시 받아야 합니다.

${Object.keys(CASES).filter(k=>k<13).map(k=>`[사례 ${k}]\n사업장 : ${CASES[k].loc}\n${CASES[k].msg}`).join('\n\n')}

<b>[사례 13]
사업장 : 사업자교육
수강생 중 괴이수칙기록원 1명 잠입. 교육 자료 전량 유출.
현재 나폴리탄 괴담 갤러리에 박제되어 있음.
해당 강사는 열세 번째 계단에서 열두 번째 계단으로 강등됨.</b>

이상으로 안전교육을 마치겠습니다.
감사합니다.

<span style="color:#888">ㅇㅇ(44.44): 13번 사례 실화임?
ㄴ ${name}: ㅇㅇ. 지금 읽은 당신도 수강생임.</span>

<button class="btn" id="pb" style="color:#fff">— TRUE END · 기록원 귀환 — 타이틀로</button></div>`;
  p.classList.add('show');$('pb').onclick=()=>{p.classList.remove('show');showTitle();};bindMenu(p);}

/* ---------- 화면 전환 ---------- */
let curId=0;
async function enter(id){
  mode='play';menuNav=null;curId=id;map=MAPS[id]();F=id===0?hubF:{};if(id===0&&Object.keys(SV.clear).length)F.met=1;
  P.x=map.start[0]*T+T/2;P.y=map.start[1]*T+T/2;gauge=null;$('gauge').style.display='none';hintEl.textContent='';
  setDrone(true,id===0?49:38+id*2);
  if(map.intro)await map.intro();
  if(gauge){$('gauge').style.display='block';$('glab').textContent=gauge.name;}
}
let hubF={};
function showTitle(){mode='menu';setDrone(false);const t=$('title');const c=clearedCount();
  t.innerHTML=`<h1>괴이 <span>사업자</span>교육</h1><div class="sub">괴이 소상공인 진흥원 · 2024년도 정기 안전교육<br>— 해당 괴이들의 사례를 반면교사 삼아, 성공한 사업장 주가 되시길 바랍니다 —</div>
  <div class="menu"><button class="btn" id="t1">${c?'교육 계속하기':'교육 시작'}</button><button class="btn" id="t2">실습장 선택</button><button class="btn" id="t3">반면교사 아카이브 (실패 영상 ${Object.keys(SV.seen).length}/13)</button><button class="btn" id="t4">기록원 수첩 다시 읽기 (${c}/12)</button><button class="btn" id="t5">기록 초기화</button></div>
  <div class="sub" style="margin-top:22px;font-size:12px">WASD 이동 · SPACE / 마우스 클릭 : 상호작용 · 선택 · W/S 선택지 이동 · M : 실습장 선택${SV.ending==='human'?'<br><b style="color:#e0b04a">TRUE END 달성</b>':''}</div>
  <div class="sub" style="font-size:11px">원작 : 디시인사이드 나폴리탄 괴담 갤러리 「사업자교육」 사례집</div>`;
  t.classList.add('show');bindMenu(t);
  $('t1').onclick=()=>{t.classList.remove('show');enter(0);};
  $('t2').onclick=()=>{t.classList.remove('show');openSelect();};
  $('t3').onclick=()=>{t.classList.remove('show');openArchive();};
  $('t4').onclick=async()=>{t.classList.remove('show');for(let i=1;i<=12;i++)if(SV.clear[i])await showNote(`괴이수칙기록원 수첩 · ${i}쪽`,PAGES[i]);showTitle();};
  $('t5').onclick=()=>{if(confirm('모든 수료 기록과 아카이브를 지울까요?')){SV={clear:{},seen:{},pages:{},ending:null};save();showTitle();}};}
function openSelect(){mode='menu';const s=$('select');
  s.innerHTML=`<h1 style="font-size:28px">실습장 선택</h1><div class="sub">각 문은 망한 선배 괴이의 사업장을 그대로 재현한 곳입니다.</div><div class="grid">`+
   [0,...Object.keys(CASES).filter(k=>k<13).map(Number)].map(k=>`<button class="btn" data-k="${k}">${k===0?'🏫 교육장 (허브)':`<b>실습장 ${k}</b>`}${k?`<span class="st">${SV.clear[k]?'수료 ✓':''}${SV.seen[k]?' ☠':''}</span><br><small>${CASES[k].loc}</small>`:'<br><small>계단 선배 · 거울 · 출석부</small>'}</button>`).join('')+
   `</div><div class="menu" style="margin-top:14px"><button class="btn" id="sb">타이틀로</button></div>`;
  s.classList.add('show');bindMenu(s);
  s.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{s.classList.remove('show');enter(+b.dataset.k);});
  $('sb').onclick=()=>{s.classList.remove('show');showTitle();};}
function openArchive(){mode='menu';const s=$('select');
  s.innerHTML=`<h1 style="font-size:28px">반면교사 아카이브</h1><div class="sub">직접 겪은 실패만 다시 볼 수 있습니다.</div><div class="grid">`+
   Object.keys(CASES).map(k=>`<button class="btn" data-k="${k}">${SV.seen[k]?`<b>사례 ${k}</b> · ${CASES[k].loc}<br><small>${CASES[k].msg.split('\n').pop()}</small>`:`<b>사례 ${k}</b><br><small>??? (미열람)</small>`}</button>`).join('')+
   `</div><div class="menu" style="margin-top:14px"><button class="btn" id="sb">타이틀로</button></div>`;
  s.classList.add('show');bindMenu(s);
  s.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{const k=+b.dataset.k;if(!SV.seen[k])return;s.classList.remove('show');await playCut(VIDS[k],k);openArchive();});
  $('sb').onclick=()=>{s.classList.remove('show');showTitle();};}

/* ---------- 메인 루프 ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;tm+=dt;
  try{
  hudEl.style.display=mode==='cut'?'none':'block';
  if(mode==='cut'&&cut){drawCut(dt);}
  else if(map&&(mode==='play'||mode==='menu')){
    if(mode==='play'&&!dlgBusy){
      let vx=(keys.d?1:0)-(keys.a?1:0),vy=(keys.s?1:0)-(keys.w?1:0);
      if(vx||vy){const l=Math.hypot(vx,vy),sp=150*dt;const nx=P.x+vx/l*sp,ny=P.y+vy/l*sp;if(!collide(nx,P.y))P.x=nx;if(!collide(P.x,ny))P.y=ny;P.step+=dt;if(Math.floor(P.step*4)!==Math.floor((P.step-dt)*4))beep(90,.03,'triangle',.015);}
      const n=nearObj();hintEl.textContent=n?`[SPACE] ${n.name}`:(hintEl.textContent.startsWith('[SPACE]')?'':hintEl.textContent);
      if(spaceHit){spaceHit=false;if(n)n.act();}
      if(mouse){const m=mouse;mouse=null;for(const ob of map.objs){if(ob.hidden||!ob.act)continue;if(Math.abs(ob.x*T+T/2-m.x)<T*.6&&Math.abs(ob.y*T+T/2-m.y)<T*.6){if(Math.hypot(ob.x*T+T/2-P.x,ob.y*T+T/2-P.y)<T*2.2)ob.act();else hintEl.textContent='너무 멀다. 가까이 가자.';break;}}}
      if(gauge){
        if(gauge.baby){const b=map.objs.find(x=>x.baby);const d=Math.hypot(b.x*T+T/2-P.x,b.y*T+T/2-P.y)/T;gauge.v+=d<4?(4-d)*7*dt:-4*dt;}
        else gauge.v+=gauge.rate*dt;
        gauge.v=Math.max(0,gauge.v);$('gfill').style.width=Math.min(100,gauge.v)+'%';
        if(gauge.v>=100){const g=gauge;gauge=null;g.onFull();}
      }
    } else {spaceHit=dlgBusy?spaceHit:false;mouse=null;}
    render();
  } else {cx.fillStyle='#000';cx.fillRect(0,0,960,600);}
  }catch(e){console.error(e);}
  requestAnimationFrame(loop);}
function render(){const th=map.theme;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(map.grid[y][x]){cx.fillStyle=th.wall;cx.fillRect(x*T,y*T,T,T);cx.fillStyle='rgba(0,0,0,.35)';cx.fillRect(x*T,y*T+T-6,T,6);cx.fillStyle='rgba(255,255,255,.04)';cx.fillRect(x*T,y*T,T,3);}
    else{cx.fillStyle=(x+y)%2?th.floor:th.floor2;cx.fillRect(x*T,y*T,T,T);}}
  for(const ob of map.objs){if(ob.hidden)continue;const px=ob.x*T+T/2,py=ob.y*T+T/2;
    if(ob.big){cx.fillStyle=`rgba(224,176,74,${.15+.1*Math.sin(tm*3)})`;cx.beginPath();cx.arc(px,py,24,0,7);cx.fill();}
    if(ob.npc){drawGhoul(cx,px,py,1.1,{col:'#3a2a1c',eye:'#f44'});}
    else{cx.fillStyle='rgba(0,0,0,.4)';cx.beginPath();cx.ellipse(px,py+14,13,4,0,0,7);cx.fill();emoji(cx,ob.e,px,py,26);}
    if(F[ob.k]){} }
  drawPlayer(cx,P.x,P.y);
  // 손전등 어둠
  const r=170+Math.sin(tm*7)*3;const g=cx.createRadialGradient(P.x,P.y,40,P.x,P.y,r+220);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.35,`rgba(0,0,0,${th.dark*.4})`);g.addColorStop(1,`rgba(0,0,0,${th.dark+.3})`);cx.fillStyle=g;cx.fillRect(0,0,960,600);
  if(Math.random()<.004){cx.fillStyle='rgba(0,0,0,.6)';cx.fillRect(0,0,960,600);}
  for(let i=0;i<60;i++){cx.fillStyle=`rgba(255,255,255,${Math.random()*.035})`;cx.fillRect(Math.random()*960,Math.random()*600,2,2);}
  // 이름표
  for(const ob of map.objs){if(ob.hidden)continue;const d=Math.hypot(ob.x*T+T/2-P.x,ob.y*T+T/2-P.y);if(d<T*3){cx.font='11px "Noto Sans KR",sans-serif';cx.textAlign='center';cx.fillStyle=`rgba(232,226,212,${1-d/(T*3)})`;cx.fillText(ob.name,ob.x*T+T/2,ob.y*T-4);}}
  hudEl.innerHTML=`<b>${map.name}</b><br>${map.clues.length?`단서 ${countClues()}/${map.clues.length}`:`수료 도장 ${clearedCount()}/12`} · M: 실습장 선택`;
}
showTitle();requestAnimationFrame(loop);
</script>
